<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EIRON STOCK"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><title>EIRON STOCK</title><style>
:root{--bg:#070707;--panel:#101010;--panel2:#151515;--line:#252525;--text:#f1ede4;--muted:#8c8c8c;--green:#32d583;--red:#ff5d67;--yellow:#f6c84c}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 70% 0%,#191919 0,#0a0a0a 28%,#070707 70%);color:var(--text);font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}.app{display:flex;min-height:100vh}.side{width:248px;padding:28px 16px;border-right:1px solid var(--line);position:fixed;height:100vh;background:linear-gradient(180deg,#080808,#0c0c0c);z-index:5}.side:after{content:"";position:absolute;inset:auto 0 0;height:42%;background:radial-gradient(circle at 25% 70%,#20202000 0,#0000 35%,#000 100%);pointer-events:none}.brand{padding:2px 10px 25px}.brand img{width:188px;max-width:100%;display:block;filter:drop-shadow(0 8px 20px #000);animation:logoIn .8s cubic-bezier(.2,.8,.2,1)}.brand small{display:block;margin-top:9px;color:#666;font-size:9px;letter-spacing:3px}.side button,.mob button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:1px solid transparent;background:none;color:#888;text-align:left;border-radius:12px;transition:.22s ease;cursor:pointer;font-size:14px}.side button:hover{transform:translateX(4px);color:#fff;background:#161616;border-color:#252525}.side button.on,.mob button.on{background:linear-gradient(135deg,#f1ede4,#d9d3c8);color:#0a0a0a;box-shadow:0 10px 30px #0008}.main{margin-left:248px;padding:25px 30px 50px;width:100%;max-width:1550px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:6px}.top h1{font-size:28px;margin:0 0 3px;font-weight:800;letter-spacing:-.04em}.top:before{content:"";position:fixed;right:30px;top:0;width:330px;height:180px;background:radial-gradient(circle,#24242455,transparent 65%);pointer-events:none}.btn{padding:11px 15px;border:1px solid #303030;border-radius:11px;background:#151515;color:#fff;cursor:pointer;transition:.2s ease;font-weight:650}.btn:hover{transform:translateY(-2px);border-color:#555;box-shadow:0 8px 24px #0008}.btn.primary{background:var(--text);color:#0a0a0a;border-color:var(--text)}.btn.danger{background:#241012;border-color:#4d2025;color:#ff9da3}.hero{position:relative;overflow:hidden;min-height:190px;margin-top:16px;padding:28px;border:1px solid #2b2b2b;border-radius:20px;background:linear-gradient(120deg,#0c0c0c,#151515 55%,#080808);box-shadow:0 22px 70px #0009}.hero:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(135deg,transparent 0 18px,#fff000 19px 20px);opacity:.02;transform:rotate(-10deg)}.hero .hero-logo{width:min(440px,70%);display:block;filter:drop-shadow(0 14px 28px #000);animation:floatLogo 5s ease-in-out infinite}.hero .scribble{position:absolute;right:30px;top:30px;font-size:13px;line-height:1.25;text-align:right;max-width:190px;color:#aaa;letter-spacing:.04em}.hero .scribble b{display:block;color:#fff;font-size:18px;margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#121212,#0e0e0e);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 12px 40px #0007;transition:.22s ease}.card:hover{transform:translateY(-2px);border-color:#383838}.kpi{position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;right:-30px;bottom:-35px;width:110px;height:110px;border-radius:50%;background:#fff;opacity:.025}.kpi .icon{font-size:22px;margin-bottom:12px}.n{font-size:27px;font-weight:850;letter-spacing:-.03em}.trend{font-size:11px;color:var(--green);margin-top:8px}.muted{color:var(--muted);font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-title h2{margin:0}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick .btn{min-height:86px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;font-size:13px}.quick .qicon{font-size:26px;margin-bottom:8px}.table{width:100%;border-collapse:collapse}.table th{color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.table th,.table td{padding:12px 7px;border-bottom:1px solid #242424;text-align:left}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#10331f;color:#52e59a;border:1px solid #1d6840;font-size:11px}.pill.low{background:#352d10;color:#ffd85c;border-color:#735f18}.activity{display:grid;gap:8px}.activity .row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #202020}.dot{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#10331f;color:#50e49a}.dot.out{background:#351316;color:#ff8b91}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#888;font-size:11px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}.field input,.field select{width:100%;padding:12px;border:1px solid #303030;background:#0b0b0b;color:#fff;border-radius:10px;outline:none}.field input:focus,.field select:focus{border-color:#666;box-shadow:0 0 0 3px #ffffff0b}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:18px;z-index:20;backdrop-filter:blur(10px)}.modal.on{display:flex;animation:fade .18s ease}.box{background:linear-gradient(145deg,#151515,#0d0d0d);border:1px solid #3a3a3a;border-radius:18px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 100px #000}.mob{display:none}.empty{padding:35px;text-align:center;color:#777}.footer-mark{margin-top:26px;padding:18px 4px;border-top:1px solid #202020;display:flex;justify-content:space-between;color:#555;font-size:10px;letter-spacing:2px;text-transform:uppercase}
@keyframes logoIn{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}@keyframes floatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.side{display:none}.main{margin:0;padding:15px 13px 82px}.grid{grid-template-columns:1fr 1fr;gap:10px}.form{grid-template-columns:1fr}.full{grid-column:auto}.mob{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0d0d0df5;border-top:1px solid #333;z-index:10;overflow:auto;padding:7px 6px;backdrop-filter:blur(14px)}.mob button{min-width:86px;justify-content:center;flex-direction:column;gap:3px;padding:8px 7px;font-size:10px}.top{align-items:flex-start}.top .btn{display:none}.hero{min-height:155px;padding:20px}.hero .hero-logo{width:90%;max-width:350px}.hero .scribble{right:16px;bottom:12px;top:auto;font-size:9px;max-width:130px}.hero .scribble b{font-size:12px}.card{padding:14px}.n{font-size:22px}.table{font-size:12px;min-width:620px}.table-wrap{overflow:auto}.footer-mark{font-size:8px}.brand img{width:170px}}
</style><body><aside class="side"><div class="brand"><img src="logo-eiron-branca.png" alt="EIRON"><small>STOCK · CUSTOS · PRECIFICAÇÃO</small></div><div id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span class="muted">Estoque · Custos · Precificação</span></div><button class="btn" onclick="backup()">↧ Exportar backup</button></div><div id="view"></div><div class="footer-mark"><span>EIRON STOCK</span><span>NASCIDOS DO REINO · ENVIADOS AO MUNDO</span></div></main><nav class="mob" id="mob"></nav><div class="modal" id="modal"><div class="box" id="box"></div></div><script>
const K="eiron_stock_v1",P=[["dash","⌂","Dashboard"],["prod","👕","Produtos"],["stock","▦","Estoque"],["buy","📦","Compras"],["price","₽","Precificação"],["mat","✦","Papelaria"],["set","⚙","Configurações"]];let db=JSON.parse(localStorage.getItem(K)||'{"p":[],"m":[],"b":[],"margin":50}'),page="dash";const R=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(+v||0),save=()=>localStorage.setItem(K,JSON.stringify(db));function nav(){let x=P.map(a=>`<button class="${page==a[0]?"on":""}" onclick="go('${a[0]}')">${a[1]} ${a[2]}</button>`).join("");nav.innerHTML=x;mob.innerHTML=x}function go(x){page=x;title.textContent=P.find(a=>a[0]==x)[2];nav();render()}function stock(p){return Object.values(p.s||{}).reduce((a,b)=>a+(+b||0),0)}function cost(p){return +p.piece+p.pers+p.freight+p.pack+p.paper+p.other}function render(){if(page=="dash")view.innerHTML=dash();if(page=="prod")view.innerHTML=prod();if(page=="stock")view.innerHTML=stk();if(page=="buy")view.innerHTML=buy();if(page=="price")view.innerHTML=price();if(page=="mat")view.innerHTML=mat();if(page=="set")view.innerHTML=settings()}function dash(){let q=db.p.reduce((a,p)=>a+stock(p),0),v=db.p.reduce((a,p)=>a+stock(p)*cost(p),0),low=db.p.filter(p=>stock(p)<=5);return `<div class="hero"><img class="hero-logo" src="logo-eiron-branca.png" alt="EIRON"><div class="scribble"><b>MAIS QUE ROUPA.</b>Um sistema para carregar o propósito até os números.<br><span style="display:block;margin-top:10px;color:#777">DISCIPLINA TAMBÉM É PROPÓSITO.</span></div></div><div class="grid"><div class="card kpi"><div class="icon">▣</div><div class="muted">TOTAL DE PRODUTOS</div><div class="n">${db.p.length}</div><div class="trend">↑ catálogo EIRON</div></div><div class="card kpi"><div class="icon">↥</div><div class="muted">UNIDADES EM ESTOQUE</div><div class="n">${q}</div><div class="trend">↑ estoque atual</div></div><div class="card kpi"><div class="icon">R$</div><div class="muted">VALOR DO ESTOQUE</div><div class="n">${R(v)}</div><div class="trend">custo real acumulado</div></div><div class="card kpi"><div class="icon">✦</div><div class="muted">MATERIAIS</div><div class="n">${db.m.length}</div><div class="trend">papelaria + embalagem</div></div></div><div class="card"><div class="section-title"><h2>Ações rápidas</h2><span class="muted">movimente seu estoque</span></div><div class="quick"><button class="btn primary" onclick="newP()"><span class="qicon">＋</span>Nova peça</button><button class="btn" onclick="go('buy')"><span class="qicon">↧</span>Entrada de estoque</button><button class="btn" onclick="go('stock')"><span class="qicon">↥</span>Ver estoque</button><button class="btn" onclick="go('price')"><span class="qicon">⌁</span>Precificar</button></div></div><div class="grid"><div class="card"><div class="section-title"><h2>Produtos em destaque</h2><span class="muted">${db.p.length} cadastrados</span></div><div class="activity" style="margin-top:10px">${db.p.slice(0,5).map(p=>`<div class="row"><div style="flex:1"><b>${p.name||'Sem nome'}</b><br><span class="muted">REF: ${p.code||'—'}</span></div><span class="pill ${stock(p)<=5?'low':''}">${stock(p)} un</span><strong>${R(p.price)}</strong></div>`).join('')||'<div class="empty">Cadastre sua primeira peça.</div>'}</div></div><div class="card"><div class="section-title"><h2>Alertas de estoque</h2><span class="muted">até 5 unidades</span></div><div class="activity" style="margin-top:10px">${low.slice(0,5).map(p=>`<div class="row"><div class="dot">!</div><div><b>${p.name||'Sem nome'}</b><br><span class="muted">${stock(p)} unidade(s) disponíveis</span></div></div>`).join('')||'<div class="empty">Estoque saudável. Nenhum alerta.</div>'}</div></div></div>`}
function prod(){return `<div class="section-title"><div><h2>Produtos</h2><span class="muted">Peças, custos e preços</span></div><button class="btn primary" onclick="newP()">＋ Nova peça</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Produto</th><th>Custo real</th><th>Venda</th><th>Estoque</th></tr>${db.p.map(p=>`<tr><td><b>${p.name||'Sem nome'}</b><br><span class="muted">${p.code||'Sem código'}</span></td><td>${R(cost(p))}</td><td>${R(p.price)}</td><td><span class="pill ${stock(p)<=5?'low':''}">${stock(p)}</span></td></tr>`).join("")||"<tr><td colspan=4 class=empty>Nenhuma peça cadastrada.</td></tr>"}</table></div></div>`}
function newP(){let x={id:crypto.randomUUID(),name:"",code:"",piece:0,pers:0,freight:0,pack:0,paper:0,other:0,price:0,s:{}};modal(`<h2>Nova peça</h2><div class=form><div class=field><label>Modelo</label><input id=n value=""></div><div class=field><label>Código</label><input id=c></div><div class=field><label>Valor da peça</label><input id=pc type=number step=.01></div><div class=field><label>Personalização</label><input id=pe type=number step=.01></div><div class=field><label>Frete</label><input id=fr type=number step=.01></div><div class=field><label>Embalagem</label><input id=pa type=number step=.01></div><div class=field><label>Papelaria</label><input id=pp type=number step=.01></div><div class=field><label>Outros custos</label><input id=ou type=number step=.01></div><div class=field><label>Preço de venda</label><input id=pr type=number step=.01></div><div class=full><label class=muted>Estoque inicial por tamanho</label><div class=form><input id=m type=number placeholder="M"><input id=g type=number placeholder="G"><input id=gg type=number placeholder="GG"><input id=xg type=number placeholder="XG"></div></div></div><p class=muted>O frete pode vir de uma compra individual ou ser alocado de um pacote.</p><button class=btn onclick="closeM()">Cancelar</button> <button class="btn primary" onclick="saveP()">Salvar</button>`)}function saveP(){db.p.push({id:crypto.randomUUID(),name:n.value,code:c.value,piece:+pc.value||0,pers:+pe.value||0,freight:+fr.value||0,pack:+pa.value||0,paper:+pp.value||0,other:+ou.value||0,price:+pr.value||0,s:{M:+m.value||0,G:+g.value||0,GG:+gg.value||0,XG:+xg.value||0}});save();closeM();render()}function stk(){return `<div class="section-title"><div><h2>Estoque</h2><span class="muted">Controle por tamanho</span></div></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Produto</th><th>M</th><th>G</th><th>GG</th><th>XG</th><th>Total</th></tr>${db.p.map(p=>`<tr><td><b>${p.name||'Sem nome'}</b><br><span class="muted">${p.code||'—'}</span></td><td>${p.s.M||0}</td><td>${p.s.G||0}</td><td>${p.s.GG||0}</td><td>${p.s.XG||0}</td><td><span class="pill ${stock(p)<=5?'low':''}">${stock(p)}</span></td></tr>`).join("")||"<tr><td colspan=6 class=empty>Nenhuma peça cadastrada.</td></tr>"}</table></div></div>`}
function buy(){return `<div class="section-title"><div><h2>Compras & Fretes</h2><span class="muted">Frete individual ou por pacote</span></div><button class="btn primary" onclick="newB()">＋ Nova compra</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Fornecedor</th><th>Itens</th><th>Peças</th><th>Frete</th><th>Total</th></tr>${db.b.map(b=>`<tr><td><b>${b.s||'—'}</b></td><td>${b.i||'—'}</td><td>${b.q}</td><td>${R(b.f)}</td><td><b>${R(b.v+b.f)}</b></td></tr>`).join("")||"<tr><td colspan=5 class=empty>Nenhuma compra registrada.</td></tr>"}</table></div></div>`}
function price(){return `<div class="section-title"><div><h2>Precificação</h2><span class="muted">Custo real + margem</span></div></div><div class="card"><div class="field"><label>Peça</label><select id="sel" onchange="calc()"><option>Selecione uma peça</option>${db.p.map(p=>`<option value="${p.id}">${p.name||'Sem nome'}</option>`).join("")}</select></div><div id="res" class="card"><span class="muted">Selecione uma peça para calcular.</span></div></div>`}
function mat(){return `<div class="section-title"><div><h2>Papelaria & Embalagem</h2><span class="muted">Materiais e kits de envio</span></div><button class="btn primary" onclick="newM()">＋ Novo material</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Item</th><th>Tipo</th><th>Fornecedor</th><th>Custo unit.</th><th>Estoque</th></tr>${db.m.map(m=>`<tr><td><b>${m.n||'Sem nome'}</b></td><td>${m.t}</td><td>${m.s||'—'}</td><td>${R(m.u)}</td><td><span class="pill ${m.q<=5?'low':''}">${m.q}</span></td></tr>`).join("")||"<tr><td colspan=5 class=empty>Nenhum item cadastrado.</td></tr>"}</table></div></div>`}
function settings(){return `<div class="section-title"><div><h2>Configurações</h2><span class="muted">Parâmetros do sistema</span></div></div><div class="card"><div class="field"><label>Margem padrão (%)</label><input id="mar" type="number" value="${db.margin}"></div><button class="btn primary" style="margin-top:12px" onclick="db.margin=+mar.value||0;save();render()">Salvar configurações</button></div>`}
function modal(x){box.innerHTML=x;modalEl=document.querySelector(".modal");modalEl.classList.add("on")}function closeM(){document.querySelector(".modal").classList.remove("on")}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="eiron-stock-backup.json";a.click()}nav();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script></body></html>
