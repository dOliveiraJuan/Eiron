<style>
:root{--bg:#070707;--panel:#101010;--panel2:#151515;--line:#292929;--text:#f1ede4;--muted:#8d8d8d;--green:#32d583;--red:#ff626b;--yellow:#f5c84c;--blue:#59a9ff}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 75% 0,#181818 0,#090909 30%,#050505 80%);color:var(--text);font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;overflow-x:hidden}button,input,select,textarea{font:inherit}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:240px;padding:24px 14px;border-right:1px solid #242424;background:linear-gradient(180deg,#080808,#0d0d0d);z-index:20}.brand{padding:4px 8px 22px}.brand img{width:165px;display:block;margin:auto;filter:drop-shadow(0 10px 25px #000);animation:logoIn .7s ease}.brand small{display:block;text-align:center;color:#666;font-size:8px;letter-spacing:2px;margin-top:10px}.side nav{display:grid;gap:5px}.side button,.mob button{border:1px solid transparent;background:transparent;color:#888;border-radius:11px;padding:12px 13px;text-align:left;cursor:pointer;transition:.22s;display:flex;gap:11px;align-items:center}.side button:hover{background:#151515;color:#fff;transform:translateX(4px)}.side button.on,.mob button.on{background:linear-gradient(135deg,#f1ede4,#d7d1c6);color:#080808;box-shadow:0 12px 30px #0008}.ico{width:22px;text-align:center}.main{margin-left:240px;padding:24px 28px 60px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.top h1{margin:0;font-size:28px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid #343434;background:#151515;color:#fff;padding:10px 14px;border-radius:11px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);border-color:#666;box-shadow:0 8px 24px #0008}.btn.primary{background:var(--text);color:#080808;border-color:var(--text)}.btn.danger{background:#2a1113;border-color:#5c252a;color:#ff9ca3}.btn.green{background:#103520;border-color:#1c7042;color:#65e9a2}.hero{position:relative;overflow:hidden;padding:24px;border:1px solid #2a2a2a;border-radius:20px;min-height:155px;background:linear-gradient(120deg,#0c0c0c,#161616,#090909);box-shadow:0 25px 80px #0009}.hero-logo{width:min(250px,60%);display:block;animation:float 5s ease-in-out infinite}.hero:after{content:"";position:absolute;right:-100px;top:-100px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#fff1,transparent 60%);opacity:.05}.scribble{position:absolute;right:26px;top:26px;text-align:right;color:#aaa;max-width:190px;font-size:12px}.scribble b{display:block;color:#fff;font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:13px}.card{background:linear-gradient(145deg,#121212,#0d0d0d);border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:13px;box-shadow:0 12px 40px #0007;transition:.22s}.card:hover{border-color:#3a3a3a}.kpi{position:relative;overflow:hidden}.kpi .n{font-size:25px;font-weight:850;margin-top:7px}.kpi .trend{font-size:11px;color:var(--green);margin-top:7px}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.quick .btn{min-height:70px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.qicon{font-size:24px;margin-bottom:6px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-title h2{margin:0;font-size:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em;text-align:left}.table th,.table td{padding:11px 7px;border-bottom:1px solid #242424}.table tr:last-child td{border-bottom:0}.product-cell{display:flex;align-items:center;gap:11px}.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#181818;border:1px solid #303030}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#10331f;border:1px solid #1b6b40;color:#55e89b;font-size:11px}.pill.low{background:#342d0d;border-color:#715d16;color:#ffdb5b}.pill.red{background:#361316;border-color:#6d242a;color:#ff989e}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.field label{display:block;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#0a0a0a;color:#fff;border:1px solid #333;border-radius:10px;padding:11px;outline:none}.field textarea{resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#777;box-shadow:0 0 0 3px #fff1}.money{position:relative}.money:before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa;font-weight:800;z-index:1}.money input{padding-left:38px}.stock-row,.chip-row{display:flex;flex-wrap:wrap;gap:8px}.stock-box{width:68px;border:1px solid #333;background:#0a0a0a;border-radius:10px;padding:8px;text-align:center}.stock-box b{display:block;font-size:10px;color:#777;margin-bottom:5px}.stock-box input{width:100%;padding:8px 4px;text-align:center}.chip{position:relative;border:1px solid #383838;background:#101010;color:#aaa;border-radius:999px;padding:9px 13px;cursor:pointer;transition:.18s}.chip input{position:absolute;opacity:0;pointer-events:none}.chip.active{border-color:#f1ede4;background:#f1ede4;color:#080808}.toggle-row{display:flex;gap:8px}.toggle-choice{border:1px solid #383838;background:#101010;color:#aaa;border-radius:11px;padding:11px 18px;cursor:pointer;transition:.18s}.toggle-choice input{position:absolute;opacity:0;pointer-events:none}.toggle-choice.active{border-color:#f1ede4;background:#f1ede4;color:#080808}.kv-list{display:grid;gap:8px}.kv{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.kv .btn{padding:8px 10px}.catalog-list{display:grid;gap:7px;margin-top:12px}.catalog-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid #292929;background:#0d0d0d;border-radius:10px}.cost-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cost-line{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:8px 0}.cost-total{font-size:19px;font-weight:850;margin-top:8px}.modal{position:fixed;inset:0;background:#000d;backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.modal.on{display:flex;animation:fade .18s}.box{width:min(900px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#161616,#0c0c0c);border:1px solid #3b3b3b;border-radius:18px;padding:20px;box-shadow:0 30px 100px #000}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.preview{width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px dashed #555;display:none}.upload{border:1px dashed #555;border-radius:12px;padding:20px;text-align:center;background:#0b0b0b;cursor:pointer}.helper{font-size:11px;color:#666;margin-top:5px}.empty{text-align:center;color:#666;padding:28px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.activity{display:grid;gap:2px}.activity-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #222}.dot{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:#10331f;color:#58e99d}.dot.out{background:#351316;color:#ff8d94}.footer{margin-top:24px;padding:18px 3px;border-top:1px solid #222;color:#555;font-size:9px;letter-spacing:2px;display:flex;justify-content:space-between}.mob{display:none}@keyframes logoIn{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:800px){.side{display:none}.main{margin:0;padding:14px 12px 90px}.mob{display:flex;position:fixed;left:0;right:0;bottom:0;padding:6px;background:#0b0b0bf2;border-top:1px solid #333;z-index:40;backdrop-filter:blur(15px);overflow:auto}.mob button{min-width:74px;justify-content:center;flex-direction:column;gap:3px;padding:7px 5px;font-size:10px}.grid{grid-template-columns:1fr 1fr;gap:9px}.quick{grid-template-columns:repeat(2,1fr)}.hero{min-height:135px;padding:18px}.hero-logo{width:52%;max-width:190px}.scribble{right:13px;top:17px;font-size:9px;max-width:120px}.scribble b{font-size:12px}.form{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:13px}.top h1{font-size:23px}.top .btn{display:none}.cost-summary{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr auto}.footer{font-size:7px}.brand img{width:150px}}
</style>

<body>
<div class="app">
<aside class="side"><div class="brand"><img src="logo-eiron-branca.png" alt="EIRON"><small>STOCK · CUSTOS · PRECIFICAÇÃO</small></div><nav id="sideNav"></nav></aside>
<main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span class="muted">Estoque · Custos · Precificação</span></div><button class="btn" onclick="backup()">↧ Backup</button></div><div id="view"></div><div class="footer"><span>EIRON STOCK</span><span>NASCIDOS DO REINO · ENVIADOS AO MUNDO</span></div></main>
<nav class="mob" id="mobNav"></nav>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
</div>
<script>
const KEY='eiron_stock_v10';
const PREV_KEYS=['eiron_stock_v9','eiron_stock_v8','eiron_stock_v7','eiron_stock_v6','eiron_stock_v5','eiron_stock_v1'];
const PREV_KEY='eiron_stock_v5';
const NAV=[['dash','⌂','Dashboard'],['prod','👕','Produtos'],['stock','▦','Estoque'],['sales','↗','Vendas'],['finance','R$','Financeiro'],['cat','☷','Cadastros'],['set','⚙','Configurações']];
const legacy=JSON.parse(localStorage.getItem('eiron_stock_v1')||'null');
let db=JSON.parse(localStorage.getItem(KEY)||'null'); if(!db){for(const k of PREV_KEYS){try{const x=JSON.parse(localStorage.getItem(k)||'null');if(x){db=x;break}}catch(e){}}} db=db||{products:[],catalog:[],freights:[],sales:[],movements:[],purchases:[],materials:[],margin:50}; db.purchases=db.purchases||[]; db.materials=db.materials||[];
if(!db.products.length&&legacy?.p?.length)db.products=legacy.p.map(p=>({id:p.id||crypto.randomUUID(),name:p.name||'',code:p.code||'',model:p.name||'',description:p.desc||'',details:[],piece:+p.piece||0,price:+p.price||0,image:p.img||'',sizes:{P:+(p.s?.P||0),M:+(p.s?.M||0),G:+(p.s?.G||0),GG:+(p.s?.GG||0),G1:+(p.s?.G1||0),G2:+(p.s?.G2||0),G3:+(p.s?.G3||0)},colors:[],personalizations:[],stationery:p.paperId?[p.paperId]:[],packaging:p.packId?[p.packId]:[],other:+p.other||0,costFreight:0,createdAt:new Date().toISOString()}));
if(!db.catalog.length&&legacy?.m?.length)db.catalog=legacy.m.map(m=>({id:m.id||crypto.randomUUID(),type:m.t==='Personalização'?'personalizacao':m.t==='Papelaria'?'papelaria':'embalagem',name:m.n||'',unitCost:+m.u||0,useQty:1,createdAt:new Date().toISOString()}));
['P','M','G','GG','G1','G2','G3'].forEach(n=>{if(!db.catalog.some(c=>c.type==='tamanho'&&String(c.name).toUpperCase()===n))db.catalog.push({id:crypto.randomUUID(),type:'tamanho',name:n,createdAt:new Date().toISOString()})});
let page='dash';
const $=id=>document.getElementById(id);
const R=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function moneyNum(v){if(typeof v==='number')return v||0;let s=String(v??'').replace(/\s|R\$/gi,'').replace(/[^0-9,.-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0;}
function moneyMaskValue(v){let raw=String(v??'').replace(/\D/g,'');if(!raw)return '';return (parseInt(raw,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function moneyField(id,val=0){return `<div class="money"><input id="${id}" inputmode="numeric" autocomplete="off" value="${moneyNum(val)?moneyMaskValue(Math.round(moneyNum(val)*100)):''}" placeholder="0,00"></div>`}
function bindMoney(id){let e=$(id);if(!e)return;const mask=()=>{let v=e.value.replace(/\D/g,'');e.value=v?moneyMaskValue(v):''};e.addEventListener('input',mask);e.addEventListener('focus',mask);e.addEventListener('blur',mask);}
function modal(html){$('modalBox').innerHTML=html;$('modal').classList.add('on')}
function closeM(){$('modal').classList.remove('on')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function nav(){let h=NAV.map(n=>`<button class="${page===n[0]?'on':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span><span>${n[2]}</span></button>`).join('');$('sideNav').innerHTML=h;$('mobNav').innerHTML=h}
function go(p){page=p;$('title').textContent=NAV.find(n=>n[0]===p)?.[2]||'Dashboard';nav();render()}
function totalStock(p){return Object.values(p.sizes||{}).reduce((a,b)=>a+(+b||0),0)}
function catalogBy(id){return db.catalog.find(c=>c.id===id)}
function itemCost(ids){return (ids||[]).reduce((s,id)=>s+(+(catalogBy(id)?.unitCost||0))*(+(catalogBy(id)?.useQty||1)),0)}
function freightAllocated(p){return +(p.costFreight||0)}
function globalMaterialCost(type){return db.catalog.filter(c=>c.type===type && c.active!==false).reduce((s,c)=>s+(+(c.unitCost||0))*(+(c.useQty||1)),0)}
function realCost(p){return (+p.piece||0)+(+p.personalizationValue||0)+globalMaterialCost('papelaria')+globalMaterialCost('embalagem')+freightAllocated(p)+(+p.other||0)}
function selectedNames(ids){return (ids||[]).map(id=>catalogBy(id)?.name).filter(Boolean)}
function render(){nav();let f={dash:dash,prod:prod,stock:stockPage,sales:sales,finance:finance,cat:catalog,set:settings}[page];$('view').innerHTML=f?f():''}
function dash(){let units=db.products.reduce((s,p)=>s+totalStock(p),0),inv=db.products.reduce((s,p)=>s+totalStock(p)*realCost(p),0),low=db.products.filter(p=>totalStock(p)<=5);return `<div class="hero"><img class="hero-logo" src="logo-eiron-branca.png"><div class="scribble"><b>MAIS QUE ROUPA.</b>Um sistema para carregar o propósito até os números.<br><span style="display:block;margin-top:7px;color:#777">DISCIPLINA TAMBÉM É PROPÓSITO.</span></div></div><div class="grid"><div class="card kpi"><div class="muted">TOTAL DE PRODUTOS</div><div class="n">${db.products.length}</div><div class="trend">catálogo EIRON</div></div><div class="card kpi"><div class="muted">UNIDADES EM ESTOQUE</div><div class="n">${units}</div><div class="trend">estoque atual</div></div><div class="card kpi"><div class="muted">VALOR DO ESTOQUE</div><div class="n">${R(inv)}</div><div class="trend">custo real acumulado</div></div><div class="card kpi"><div class="muted">CADASTROS AUXILIARES</div><div class="n">${db.catalog.length}</div><div class="trend">cores + tamanhos + modelos + fornecedores + materiais</div></div></div><div class="card"><div class="section-title"><h2>Ações rápidas</h2><span class="muted">movimente seu estoque</span></div><div class="quick"><button class="btn primary" onclick="newProduct()"><span class="qicon">＋</span>Nova peça</button><button class="btn" onclick="newSale()"><span class="qicon">↗</span>Nova venda</button><button class="btn" onclick="go('stock')"><span class="qicon">▦</span>Editar estoque</button><button class="btn" onclick="newFreight()"><span class="qicon">🚚</span>Compra / frete</button><button class="btn" onclick="go('cat')"><span class="qicon">✦</span>Cadastros</button></div></div><div class="grid2"><div class="card"><div class="section-title"><h2>Produtos em destaque</h2><span class="muted">${db.products.length} cadastrados</span></div><div class="activity">${db.products.slice(0,5).map(p=>`<div class="activity-row"><img class="thumb" src="${p.image||'icon-192.png'}"><div style="flex:1"><b>${esc(p.name)||'Sem nome'}</b><br><span class="muted">${esc(p.description||p.code||'Sem descrição')}</span></div><span class="pill ${totalStock(p)<=5?'low':''}">${totalStock(p)} un</span><strong>${R(p.price)}</strong></div>`).join('')||'<div class="empty">Cadastre sua primeira peça.</div>'}</div></div><div class="card"><div class="section-title"><h2>Estoque baixo</h2><span class="muted">até 5 unidades</span></div><div class="activity">${low.slice(0,5).map(p=>`<div class="activity-row"><div class="dot">!</div><div><b>${esc(p.name)}</b><br><span class="muted">${totalStock(p)} unidade(s)</span></div></div>`).join('')||'<div class="empty">Estoque saudável.</div>'}</div></div></div>`}
function prod(){return `<div class="section-title"><div><h2>Produtos</h2><span class="muted">Imagem, modelo, descrição, cores, tamanhos e custo real</span></div><button class="btn primary" onclick="newProduct()">＋ Nova peça</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Produto</th><th>Modelo / cor</th><th>Custo real</th><th>Venda</th><th>Estoque</th><th></th></tr>${db.products.map(p=>`<tr><td><div class="product-cell"><img class="thumb" src="${p.image||'icon-192.png'}"><div><b>${esc(p.name)||'Sem nome'}</b><br><span class="muted">${esc(p.code||'Sem SKU')}</span><br><span class="muted">${esc(p.description||'Sem descrição')}</span></div></div></td><td>${esc(p.model||'—')}<br><span class="muted">${selectedNames(p.colors).join(', ')||'Sem cor'}</span></td><td>${R(realCost(p))}</td><td>${R(p.price)}</td><td><span class="pill ${totalStock(p)<=5?'low':''}">${totalStock(p)}</span></td><td><button class="btn" onclick="editProduct('${p.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma peça cadastrada.</td></tr>'}</table></div></div>`}
function stockPage(){let mats=db.catalog.filter(c=>['papelaria','embalagem'].includes(c.type));return `<div class="section-title"><div><h2>Estoque</h2><span class="muted">Peças por tamanho + papelaria + embalagem em um só lugar</span></div></div><div class="card"><div class="section-title"><h2>Peças</h2><span class="muted">Estoque físico</span></div><div class="grid">${db.products.map(p=>`<div class="card"><div class="product-cell"><img class="thumb" src="${p.image||'icon-192.png'}"><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.code||'—')}</span></div></div><div class="stock-row" style="margin-top:12px">${Object.keys(p.sizes||{}).map(z=>`<div class="stock-box"><b>${z}</b><input type="number" min="0" value="${+(p.sizes?.[z]||0)}" onchange="setStock('${p.id}','${z}',this.value)"></div>`).join('')}</div><div class="actions"><button class="btn green" onclick="adjustStock('${p.id}',1)">＋ Entrada</button><button class="btn danger" onclick="adjustStock('${p.id}',-1)">− Saída</button><span class="pill ${totalStock(p)<=5?'low':''}">${totalStock(p)} total</span></div></div>`).join('')||'<div class="empty">Nenhuma peça cadastrada.</div>'}</div></div><div class="card"><div class="section-title"><h2>Papelaria e embalagem</h2><span class="muted">Cadastradas uma única vez</span></div><div class="table-wrap"><table class="table"><tr><th>Item</th><th>Categoria</th><th>Descrição / tamanho</th><th>Custo</th><th>Quantidade</th><th></th></tr>${mats.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${c.type==='papelaria'?'Papelaria':'Embalagem'}</td><td>${esc(c.description||'—')}</td><td>${R(c.unitCost)}</td><td><input style="width:85px" type="number" min="0" value="${+(c.stock||0)}" onchange="setMaterialStock('${c.id}',this.value)"></td><td><button class="btn" onclick="editCatalog('${c.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum material cadastrado.</td></tr>'}</table></div></div>`}
function setMaterialStock(id,v){let c=catalogBy(id);if(!c)return;let old=+(c.stock||0),n=Math.max(0,+v||0);c.stock=n;db.movements.unshift({id:crypto.randomUUID(),type:n-old>=0?'entrada':'saída',materialId:id,qty:Math.abs(n-old),note:'Ajuste de estoque de material',date:new Date().toISOString()});save();render()}
function setStock(id,z,v){let p=db.products.find(x=>x.id===id);if(!p)return;let old=+(p.sizes[z]||0),n=Math.max(0,+v||0);p.sizes[z]=n;db.movements.unshift({id:crypto.randomUUID(),type:n-old>=0?'entrada':'saída',productId:id,size:z,qty:Math.abs(n-old),note:'Ajuste manual',date:new Date().toISOString()});save();render()}
function adjustStock(id,delta){let p=db.products.find(x=>x.id===id);if(!p)return;modal(`<div class="modal-head"><h2>${delta>0?'Entrada':'Saída'} de estoque</h2><button class="btn" onclick="closeM()">×</button></div><div class="field"><label>Tamanho</label><select id="adjSize">${Object.keys(p.sizes||{}).map(z=>`<option>${z}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Quantidade</label><input id="adjQty" type="number" min="1" value="1"></div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn ${delta>0?'green':'danger'}" onclick="applyAdjust('${id}',${delta})">Confirmar</button></div>`)}
function applyAdjust(id,delta){let p=db.products.find(x=>x.id===id),z=$('adjSize').value,q=Math.max(1,+$('adjQty').value||1),old=+(p.sizes[z]||0),n=delta>0?old+q:Math.max(0,old-q);p.sizes[z]=n;db.movements.unshift({id:crypto.randomUUID(),type:delta>0?'entrada':'saída',productId:id,size:z,qty:Math.abs(n-old),note:'Ajuste manual',date:new Date().toISOString()});save();closeM();render()}
function sales(){return `<div class="section-title"><div><h2>Vendas</h2><span class="muted">Venda por item e tamanho reduz o estoque automaticamente</span></div><button class="btn primary" onclick="newSale()">＋ Nova venda</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Data</th><th>Produto</th><th>Tamanho</th><th>Qtd.</th><th>Valor</th><th>Pagamento</th></tr>${db.sales.map(s=>{let p=db.products.find(x=>x.id===s.productId);return `<tr><td>${new Date(s.date).toLocaleString('pt-BR')}</td><td><b>${esc(p?.name||s.productName)}</b></td><td>${s.size}</td><td>${s.qty}</td><td>${R(s.total)}</td><td>${esc(s.payment)}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Nenhuma venda registrada.</td></tr>'}</table></div></div>`}
function newSale(){modal(`<div class="modal-head"><h2>Nova venda</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><div class="field full"><label>Produto *</label><select id="saleProd" onchange="updateSaleSizes()"><option value="">Selecione</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} • ${R(p.price)}</option>`).join('')}</select></div><div class="field"><label>Tamanho *</label><select id="saleSize"></select></div><div class="field"><label>Quantidade *</label><input id="saleQty" type="number" min="1" value="1"></div><div class="field"><label>Valor unitário</label>${moneyField('saleUnit')}</div><div class="field"><label>Pagamento</label><select id="salePay"><option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Outro</option></select></div><div class="field"><label>Cliente (opcional)</label><input id="saleClient" placeholder="Nome"></div></div><div class="helper">Ao confirmar, a quantidade é retirada automaticamente do tamanho selecionado.</div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveSale()">Registrar venda</button></div>`);bindMoney('saleUnit');updateSaleSizes()}
function updateSaleSizes(){let p=db.products.find(x=>x.id===$('saleProd')?.value),s=$('saleSize');if(!s)return;s.innerHTML=p?Object.keys(p.sizes||{}).map(z=>`<option value="${z}">${z} • ${+(p.sizes[z]||0)} em estoque</option>`).join(''):'<option>Selecione</option>';if(p)$('saleUnit').value=R(p.price).replace('R$','').trim()}
function saveSale(){let p=db.products.find(x=>x.id===$('saleProd').value),z=$('saleSize').value,q=Math.max(1,+$('saleQty').value||1),unit=moneyNum($('saleUnit').value);if(!p){alert('Selecione um produto.');return}if((+(p.sizes[z]||0))<q){alert('Estoque insuficiente para esse tamanho.');return}p.sizes[z]-=q;db.sales.unshift({id:crypto.randomUUID(),productId:p.id,productName:p.name,size:z,qty:q,unit,total:unit*q,payment:$('salePay').value,client:$('saleClient').value.trim(),date:new Date().toISOString()});db.movements.unshift({id:crypto.randomUUID(),type:'saída',productId:p.id,size:z,qty:q,note:'Venda',date:new Date().toISOString()});save();closeM();render()}
function buy(){return finance()}
function finance(){let totalCost=db.products.reduce((s,p)=>s+totalStock(p)*realCost(p),0);return `<div class="section-title"><div><h2>Custos</h2><span class="muted">Compras, fretes, custo real e precificação em um só lugar</span></div><button class="btn primary" onclick="newFreight()">＋ Compra / Frete</button></div><div class="grid"><div class="card kpi"><div class="muted">VALOR DO ESTOQUE</div><div class="n">${R(totalCost)}</div></div><div class="card kpi"><div class="muted">CUSTO MÉDIO DOS MATERIAIS</div><div class="n">${R(globalMaterialCost('papelaria')+globalMaterialCost('embalagem'))}</div></div><div class="card kpi"><div class="muted">FRETES REGISTRADOS</div><div class="n">${R(db.freights.reduce((s,f)=>s+(+f.value||0),0))}</div></div></div><div class="card"><div class="section-title"><h2>Compras e Fretes</h2><span class="muted">Registre a compra e o rateio sem aumentar o estoque</span></div><div class="table-wrap"><table class="table"><tr><th>Data</th><th>Compra</th><th>Itens</th><th>Frete</th><th>Rateio</th></tr>${db.freights.map(f=>`<tr><td>${new Date(f.date).toLocaleDateString('pt-BR')}</td><td>${esc(f.note||'Compra')}</td><td>${(f.items||[]).map(i=>esc(i.name)+' ('+i.qty+' un)').join(', ')||'—'}</td><td>${R(f.value)}</td><td>${R(f.perUnit||0)}/un</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhuma compra/frete registrado.</td></tr>'}</table></div></div><div class="card"><div class="section-title"><h2>Precificação</h2><span class="muted">O custo real da peça e o preço de venda calculados automaticamente</span></div><div class="field"><label>Peça</label><select id="priceProd" onchange="calcPrice()"><option value="">Selecione</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div id="priceRes" class="card"><span class="muted">Selecione uma peça.</span></div></div></div>`}
function newFreight(){modal(`<div class="modal-head"><h2>Compra + frete</h2><button class="btn" onclick="closeM()">×</button></div><div class="helper" style="margin-bottom:12px">Aqui você registra o que comprou e o frete. <b>Isso não adiciona estoque.</b> O estoque é lançado somente em Estoque.</div><div class="form"><div class="field full"><label>Descrição da compra</label><input id="fn" placeholder="Ex.: Fornecedor X · compra de 10 camisetas"></div><div class="field"><label>Valor do frete</label>${moneyField('fv')}</div><div class="field"><label>Como distribuir</label><select id="fa"><option value="unit">Dividir pelo total de unidades compradas</option><option value="product">Adicionar o rateio ao custo da peça</option></select></div><div class="field full"><label>Produtos e quantidades compradas</label><div id="purchaseLines">${purchaseLine()}</div><button class="btn" style="margin-top:8px" onclick="addPurchaseLine()">＋ Adicionar peça</button></div></div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveFreight()">Salvar compra</button></div>`);bindMoney('fv')}
function purchaseLine(){return `<div class="purchase-line" style="display:grid;grid-template-columns:1fr 90px 70px;gap:8px;margin-bottom:8px"><select class="buyProd"><option value="">Produto</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input class="buyQty" type="number" min="1" value="1" placeholder="Qtd."><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function addPurchaseLine(){let d=document.createElement('div');d.innerHTML=purchaseLine();$('purchaseLines').appendChild(d.firstElementChild)}
function saveFreight(){let value=moneyNum($('fv').value),lines=[...document.querySelectorAll('.purchase-line')].map(r=>({productId:r.querySelector('.buyProd').value,qty:Math.max(1,+r.querySelector('.buyQty').value||1)})).filter(x=>x.productId);if(value<0||!lines.length){alert('Informe o frete e pelo menos uma peça.');return}let units=lines.reduce((s,x)=>s+x.qty,0),per=units?value/units:0;let items=lines.map(x=>{let p=db.products.find(y=>y.id===x.productId);if(p)p.costFreight=(+(p.costFreight||0))+per;return {productId:x.productId,name:p?.name||'',qty:x.qty,freight:per*x.qty}});db.freights.unshift({id:crypto.randomUUID(),mode:'package',value,allocation:'purchase_quantity',note:$('fn').value.trim(),items,perUnit:per,date:new Date().toISOString()});db.purchases.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),items});save();closeM();render()}
function price(){return finance()}
function calcPrice(){let p=db.products.find(x=>x.id===$('priceProd')?.value);if(!p){$('priceRes').innerHTML='<span class="muted">Selecione uma peça.</span>';return}let piece=+p.piece||0,pers=p.personalized?(+p.personalizationValue||0):0,paper=globalMaterialCost('papelaria'),pack=globalMaterialCost('embalagem'),freight=freightAllocated(p),other=+p.other||0,total=piece+pers+paper+pack+freight+other,suggest=total*(1+(+db.margin||0)/100);$('priceRes').innerHTML=`<h3 style="margin-top:0">Resumo automático</h3><div class="cost-summary"><div><div class="cost-line"><span>Peça</span><b>${R(piece)}</b></div><div class="cost-line"><span>Personalização</span><b>${R(pers)}</b></div><div class="cost-line"><span>Papelaria</span><b>${R(paper)}</b></div></div><div><div class="cost-line"><span>Embalagem</span><b>${R(pack)}</b></div><div class="cost-line"><span>Frete rateado</span><b>${R(freight)}</b></div><div class="cost-line"><span>Outros</span><b>${R(other)}</b></div></div></div><div class="cost-total">Custo real: ${R(total)}</div><div style="margin-top:7px">Preço cadastrado: <b>${R(p.price)}</b> · Sugestão com ${db.margin||0}%: <b>${R(suggest)}</b></div>`}
function catalog(){let types=[['cor','Cores'],['tamanho','Tamanhos'],['modelo','Modelos'],['fornecedor','Fornecedores'],['personalizacao','Personalizações'],['papelaria','Papelaria'],['embalagem','Embalagens']];return `<div class="section-title"><div><h2>Cadastros</h2><span class="muted">Cadastre uma vez e reutilize nas peças.</span></div><button class="btn primary" onclick="newCatalog()">＋ Novo cadastro</button></div><div class="grid2">${types.map(t=>`<div class="card"><div class="section-title"><h2>${t[1]}</h2><span class="pill">${db.catalog.filter(x=>x.type===t[0]).length}</span></div><div class="catalog-list">${db.catalog.filter(x=>x.type===t[0]).map(c=>`<div class="catalog-item"><div><b>${esc(c.name)}</b>${c.type==='fornecedor'?`<br><span class="muted">${esc(c.contact||'')}</span>`:''}${['papelaria','embalagem'].includes(c.type)?`<br><span class="muted">${esc(c.description||'Sem especificação')} · ${R(c.unitCost)} · estoque: ${c.stock||0}</span>`:''}</div><button class="btn" onclick="editCatalog('${c.id}')">Editar</button></div>`).join('')||'<div class="empty">Nenhum item cadastrado.</div>'}</div></div>`).join('')}</div>`}
function newCatalog(){modal(catalogForm());bindCatalogMoney();toggleCatalogFields()}
function catalogForm(c={}){let type=c.type||'papelaria';return `<div class="modal-head"><h2>${c.id?'Editar':'Novo'} cadastro</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><div class="field"><label>Classificação *</label><select id="ct" onchange="toggleCatalogFields()">${[['cor','Cor'],['tamanho','Tamanho'],['modelo','Modelo'],['fornecedor','Fornecedor'],['personalizacao','Personalização'],['papelaria','Papelaria'],['embalagem','Embalagem']].map(x=>`<option value="${x[0]}" ${type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Nome / identificação *</label><input id="cn" value="${esc(c.name||'')}" placeholder="Ex.: Papel seda 30x50, Tag pequena, Fornecedor X"></div><div class="field full"><label>Descrição / especificação</label><textarea id="cd" rows="2" placeholder="Tamanho, material, acabamento, código interno...">${esc(c.description||'')}</textarea></div><div id="contactField" class="field"><label>Contato / observação</label><input id="cc" value="${esc(c.contact||'')}" placeholder="WhatsApp, site ou observação"></div><div id="costField" class="field"><label>Valor unitário</label>${moneyField('cu',c.unitCost||0)}</div><div id="useField" class="field"><label>Quantidade usada por peça</label><input id="cuse" type="number" min="1" value="${+(c.useQty||1)}"></div><div id="stockField" class="field"><label>Quantidade em estoque</label><input id="cstock" type="number" min="0" value="${+(c.stock||0)}"></div><div id="activeField" class="field"><label>Entrar automaticamente no custo das peças?</label><select id="cactive"><option value="true" ${c.active!==false?'selected':''}>Sim</option><option value="false" ${c.active===false?'selected':''}>Não</option></select></div><div id="imageField" class="field full"><label>Imagem · opcional</label><label class="upload" for="cf">＋ Adicionar imagem</label><input id="cf" type="file" accept="image/*" style="display:none"><img id="cimg" class="preview" src="${c.image||''}" ${c.image?'style="display:block"':''}></div></div><div class="helper">Cores, tamanhos, modelos, fornecedores e personalizações são cadastros de apoio. Personalização possui valor por peça e é escolhida dentro do cadastro da roupa. Papelaria e embalagem têm descrição, tamanho, custo e estoque e entram automaticamente no custo das peças quando ativas.</div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveCatalog('${c.id||''}')">Salvar cadastro</button></div>`}
function toggleCatalogFields(){let t=$('ct')?.value;if(!t)return;let material=['papelaria','embalagem'].includes(t),pers=t==='personalizacao';if($('costField'))$('costField').style.display=(material||pers)?'block':'none';if($('useField'))$('useField').style.display=material?'block':'none';if($('stockField'))$('stockField').style.display=material?'block':'none';if($('activeField'))$('activeField').style.display=material?'block':'none';if($('contactField'))$('contactField').style.display=t==='fornecedor'?'block':'none';if($('imageField'))$('imageField').style.display=['fornecedor','papelaria','embalagem','cor','modelo','personalizacao'].includes(t)?'block':'none'}
function bindCatalogMoney(){if($('cu'))bindMoney('cu');let f=$('cf');if(f)f.addEventListener('change',e=>{let file=e.target.files?.[0];if(!file)return;if(file.size>5*1024*1024){alert('Imagem acima de 5 MB.');return}let r=new FileReader();r.onload=()=>{$('cimg').src=r.result;$('cimg').style.display='block';window.__catalogImg=r.result};r.readAsDataURL(file)});window.__catalogImg=window.__catalogImg||''}
function saveCatalog(id){let t=$('ct').value,n=$('cn').value.trim();if(!n){alert('Digite o nome.');return}let c=id?catalogBy(id):{id:crypto.randomUUID(),createdAt:new Date().toISOString()};Object.assign(c,{type:t,name:n,description:$('cd')?.value.trim()||'',contact:$('cc')?.value.trim()||'',unitCost:moneyNum($('cu')?.value||0),useQty:Math.max(1,+($('cuse')?.value||1)),stock:Math.max(0,+($('cstock')?.value||0)),active:$('cactive')?.value!=='false',image:window.__catalogImg||c.image||''});if(!id)db.catalog.push(c);save();closeM();render()}
function editCatalog(id){let c=catalogBy(id);window.__catalogImg=c.image||'';modal(catalogForm(c));bindCatalogMoney();toggleCatalogFields()}
function options(type,selected=[]){return db.catalog.filter(c=>c.type===type).map(c=>`<label class="chip ${selected.includes(c.id)?'active':''}"><input type="checkbox" value="${c.id}" ${selected.includes(c.id)?'checked':''} onchange="this.parentElement.classList.toggle('active',this.checked)">${esc(c.name)}${['personalizacao','papelaria','embalagem'].includes(type)?` · ${R(c.unitCost)}`:''}</label>`).join('')||'<span class="muted">Nenhum cadastrado. Crie em Cadastros.</span>'}
function selectOptions(type,selected=''){return `<option value="">Selecione...</option>`+db.catalog.filter(c=>c.type===type).map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}
function selectOptionsWithCost(type,selected=''){return `<option value="">Selecione...</option>`+db.catalog.filter(c=>c.type===type).map(c=>`<option value="${c.id}" data-cost="${+(c.unitCost||0)}" ${c.id===selected?'selected':''}>${esc(c.name)} · ${R(c.unitCost||0)}</option>`).join('')}
function togglePersonalizationFields(){let yes=!!$('ppersonalizedYes')?.checked,box=$('personalizationFields');if(box)box.style.display=yes?'grid':'none';document.querySelectorAll('.toggle-choice').forEach(x=>x.classList.remove('active'));let target=yes?$('ppersonalizedYes'):$('ppersonalizedNo');target?.parentElement.classList.add('active');if(yes)updatePersonalizationValue();else if($('ppersValue')){$('ppersValue').value='0,00'}}
function updatePersonalizationValue(){let sel=$('ppersSelect'),c=catalogBy(sel?.value),cost=c?Number(c.unitCost||0)*Number(c.useQty||1):0;if($('productCostPreview')){$('productCostPreview').dataset.personalizationCost=String(cost);updateProductCostPreview();}}
function updateProductCostPreview(){let piece=moneyNum($('ppiece')?.value||0),pers=$('ppersonalizedYes')?.checked?Number($('productCostPreview')?.dataset.personalizationCost||0):0,paper=globalMaterialCost('papelaria'),pack=globalMaterialCost('embalagem'),freight=Number($('productCostPreview')?.dataset.freight||0),other=moneyNum($('pother')?.value||0),total=piece+pers+paper+pack+freight+other;if($('productCostPreview'))$('productCostPreview').innerHTML=`<b>Resumo automático do custo</b><div class="cost-line"><span>Peça</span><b>${R(piece)}</b></div><div class="cost-line"><span>Personalização</span><b>${R(pers)}</b></div><div class="cost-line"><span>Papelaria</span><b>${R(paper)}</b></div><div class="cost-line"><span>Embalagem</span><b>${R(pack)}</b></div><div class="cost-line"><span>Frete rateado</span><b>${R(freight)}</b></div><div class="cost-line"><span>Outros custos</span><b>${R(other)}</b></div><div class="cost-total">Custo real da peça: ${R(total)}</div>`;}
function newProduct(){productModal({})}
function editProduct(id){productModal(db.products.find(p=>p.id===id))}
function productModal(p){p=p||{};let descRows=p.details||[];let sizeCats=db.catalog.filter(c=>c.type==='tamanho').sort((a,b)=>['P','M','G','GG','G1','G2','G3'].indexOf(a.name.toUpperCase())-['P','M','G','GG','G1','G2','G3'].indexOf(b.name.toUpperCase()));modal(`<div class="modal-head"><h2>${p.id?'Editar peça':'Nova peça'}</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><div class="field full"><label>Imagem da peça · opcional</label><label class="upload" for="pf">＋ Adicionar imagem</label><input id="pf" type="file" accept="image/*" style="display:none"><img id="pimg" class="preview" src="${p.image||''}" ${p.image?'style="display:block"':''}></div><div class="field"><label>Modelo *</label><select id="pn">${selectOptions('modelo',p.modelId||'')}</select></div><div class="field"><label>Nome da peça *</label><input id="pname" value="${esc(p.name||'')}" placeholder="Ex.: Camiseta Keryx"></div><div class="field"><label>Código / SKU</label><input id="pc" value="${esc(p.code||'')}"></div><div class="field"><label>Fornecedor da peça</label><select id="psupplier">${selectOptions('fornecedor',p.supplierId||'')}</select></div><div class="field"><label>Valor da peça *</label>${moneyField('ppiece',p.piece||0)}</div><div class="field"><label>Preço de venda *</label>${moneyField('pprice',p.price||0)}</div><div class="field full"><label>Cores · sem quantidade</label><div class="chip-row">${options('cor',p.colors||[])}</div></div><div class="field full"><label>Tamanhos e estoque inicial</label><div class="stock-row">${sizeCats.map(z=>`<div class="stock-box"><b>${esc(z.name.toUpperCase())}</b><input id="sz_${z.id}" type="number" min="0" value="${+(p.sizes?.[z.name.toUpperCase()]||0)}"></div>`).join('')}</div><div class="helper">P, M, G, GG, G1, G2 e G3 entram automaticamente. Outros tamanhos podem ser cadastrados.</div></div><div class="field full"><label>Personalização da peça</label><div class="toggle-row"><label class="toggle-choice ${!p.personalized?'active':''}"><input id="ppersonalizedNo" type="radio" name="ppersonalized" value="no" ${!p.personalized?'checked':''} onchange="togglePersonalizationFields()"> Não</label><label class="toggle-choice ${p.personalized?'active':''}"><input id="ppersonalizedYes" type="radio" name="ppersonalized" value="yes" ${p.personalized?'checked':''} onchange="togglePersonalizationFields()"> Sim</label></div><div id="personalizationFields" class="form" style="margin-top:10px;display:${p.personalized?'grid':'none'}"><div class="field full"><label>Selecione a personalização cadastrada</label><select id="ppersSelect" onchange="updatePersonalizationValue()">${selectOptionsWithCost('personalizacao',p.personalizationId||'')}</select></div><div class="field full"><div class="muted" style="padding:12px;border:1px solid #292929;border-radius:10px;background:#0a0a0a">O valor da personalização é puxado automaticamente do cadastro. Não existe campo de custo adicional nesta peça.</div></div></div><div class="helper">Não = nenhuma personalização. Sim = escolha uma personalização já cadastrada. O valor cadastrado será usado automaticamente no resumo do custo.</div></div><div class="field full"><div class="card"><b>Papelaria + embalagem</b><div class="helper">Não precisa selecionar na peça. O sistema usa automaticamente os itens ativos cadastrados em Cadastros e soma seus custos.</div><div class="cost-line"><span>Papelaria padrão</span><b>${R(globalMaterialCost('papelaria'))}</b></div><div class="cost-line"><span>Embalagem padrão</span><b>${R(globalMaterialCost('embalagem'))}</b></div></div></div><div class="field full"><label>Descrição técnica · adicione campos</label><div id="kv" class="kv-list">${descRows.map(r=>kvRow(r.key,r.value)).join('')}</div><button class="btn" style="margin-top:8px" onclick="addKV()">＋ Adicionar campo</button></div><div class="field"><label>Outros custos</label>${moneyField('pother',p.other||0)}</div><div class="field"><label>Frete</label><div class="muted" style="padding:12px;border:1px solid #292929;border-radius:10px;background:#0a0a0a">Lançado em Compras & Fretes. Rateado atual: <b>${R(p.costFreight||0)}</b></div></div></div><div id="productCostPreview" class="card"><b>Resumo automático</b><div class="helper">Custo = peça + personalização + papelaria + embalagem + frete rateado + outros.</div></div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button>${p.id?`<button class="btn danger" onclick="deleteProduct('${p.id}')">Excluir</button>`:''}<button class="btn primary" onclick="saveProduct('${p.id||''}')">Salvar peça</button></div>`);['ppiece','pprice','pother'].forEach(bindMoney);['ppiece','pother','ppersSelect'].forEach(id=>$(id)?.addEventListener('input',updateProductCostPreview));togglePersonalizationFields();updatePersonalizationValue();updateProductCostPreview();$('pf').addEventListener('change',e=>{let f=e.target.files?.[0];if(!f)return;if(f.size>5*1024*1024){alert('Imagem acima de 5 MB.');return}let r=new FileReader();r.onload=()=>{$('pimg').src=r.result;$('pimg').style.display='block';window.__productImg=r.result};r.readAsDataURL(f)});window.__productImg=p.image||''}
function kvRow(k='',v=''){return `<div class="kv"><input class="kvk" value="${esc(k)}" placeholder="Nome do campo"><input class="kvv" value="${esc(v)}" placeholder="O que é"><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function addKV(){let d=document.createElement('div');d.innerHTML=kvRow();$('kv').appendChild(d.firstElementChild)}
function checked(type){return [...document.querySelectorAll(`.chip input:checked`)].filter(x=>db.catalog.find(c=>c.id===x.value)?.type===type).map(x=>x.value)}
function detailValues(){return [...document.querySelectorAll('#kv .kv')].map(r=>({key:r.querySelector('.kvk').value.trim(),value:r.querySelector('.kvv').value.trim()})).filter(x=>x.key||x.value)}
function saveProduct(id){let old=id?db.products.find(p=>p.id===id):null;let p=old||{id:crypto.randomUUID(),createdAt:new Date().toISOString()};let sizes={};db.catalog.filter(c=>c.type==='tamanho').forEach(z=>sizes[z.name.toUpperCase()]=Math.max(0,+($('sz_'+z.id)?.value||0)));let details=detailValues();Object.assign(p,{model:catalogBy($('pn').value)?.name||'',modelId:$('pn').value,name:$('pname').value.trim(),code:$('pc').value.trim(),supplierId:$('psupplier').value,piece:moneyNum($('ppiece').value),price:moneyNum($('pprice').value),colors:checked('cor'),sizes,personalizations:[],stationery:[],packaging:[],personalized:$('ppersonalizedYes')?.checked||false,personalizationId:$('ppersonalizedYes')?.checked?($('ppersSelect')?.value||''):'',personalizationTypeText:$('ppersonalizedYes')?.checked?(catalogBy($('ppersSelect')?.value)?.name||''):'',personalizationSupplier:'',personalizationValue:$('ppersonalizedYes')?.checked?(Number(catalogBy($('ppersSelect')?.value)?.unitCost||0)*Number(catalogBy($('ppersSelect')?.value)?.useQty||1)):0,details,description:details.map(x=>`${x.key}: ${x.value}`).join(' · '),other:moneyNum($('pother').value),image:window.__productImg||old?.image||'',costFreight:+(old?.costFreight||0)});if(!p.name||!p.modelId){alert('Preencha modelo e nome da peça.');return}if(!old)db.products.push(p);save();closeM();render()}
function deleteProduct(id){if(!confirm('Excluir esta peça?'))return;db.products=db.products.filter(p=>p.id!==id);save();closeM();render()}
function updateProductPreview(){let el=$('pricePreview');if(el){} }
function settings(){return `<div class="section-title"><div><h2>Configurações</h2><span class="muted">Margem padrão e backup</span></div></div><div class="card"><div class="field"><label>Margem padrão (%)</label><input id="margin" type="number" min="0" value="${db.margin||0}"></div><div class="actions"><button class="btn primary" onclick="db.margin=+$('margin').value||0;save();render()">Salvar</button><button class="btn" onclick="backup()">Exportar backup</button><button class="btn danger" onclick="resetData()">Apagar dados locais</button></div></div>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='eiron-stock-backup.json';a.click()}
function resetData(){if(confirm('Apagar todos os dados deste aparelho?')){localStorage.removeItem(KEY);location.reload()}}
function updateCatalogChipCost(){}
db.products.forEach(p=>{p.sizes=p.sizes||{};['P','M','G','GG','G1','G2','G3'].forEach(z=>{if(p.sizes[z]==null)p.sizes[z]=0})});save();
render();
if('serviceWorker' in navigator)window.addEventListener('load',async()=>{try{const V='eiron-stock-v10';const reset=localStorage.getItem('__eiron_sw_version')!==V;const regs=await navigator.serviceWorker.getRegistrations();if(reset){for(const r of regs)await r.unregister();localStorage.setItem('__eiron_sw_version',V);if(navigator.serviceWorker.controller){location.reload();return}}await navigator.serviceWorker.register('./sw.js?v=10',{updateViaCache:'none'});}catch(e){}});
</script>
</body></html>
