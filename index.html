m:uppercase;letter-spacing:.08em}.table th,.table td{padding:12px 7px;border-bottom:1px solid #242424;text-align:left}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#10331f;color:#52e59a;border:1px solid #1d6840;font-size:11px}.pill.low{background:#352d10;color:#ffd85c;border-color:#735f18}.activity{display:grid;gap:8px}.activity .row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #202020}.dot{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#10331f;color:#50e49a}.dot.out{background:#351316;color:#ff8b91}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#888;font-size:11px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #303030;background:#0b0b0b;color:#fff;border-radius:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#666;box-shadow:0 0 0 3px #ffffff0b}.money-wrap{position:relative}.money-wrap:before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa;font-weight:700;z-index:1}.money-wrap input{padding-left:38px}.stock-grid{display:grid;grid-template-columns:repeat(4,minmax(76px,1fr));gap:8px;margin-top:8px}.stock-box{border:1px solid #303030;background:#0b0b0b;border-radius:10px;padding:9px;text-align:center}.stock-box span{display:block;font-size:10px;color:#777;text-transform:uppercase;margin-bottom:5px}.stock-box input{width:100%;padding:9px;text-align:center}.product-thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#181818;border:1px solid #2c2c2c;display:block}.product-cell{display:flex;align-items:center;gap:12px}.desc{display:block;max-width:420px;margin-top:4px}.select-card{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.catalog-badge{display:inline-flex;padding:3px 7px;border:1px solid #333;border-radius:999px;color:#aaa;font-size:10px;margin-top:4px}.small-actions{display:flex;gap:7px;flex-wrap:wrap}.modal .box{animation:modalIn .2s ease}.preview{width:110px;height:110px;border:1px dashed #444;border-radius:12px;object-fit:cover;display:none}.upload-box{border:1px dashed #444;border-radius:12px;padding:16px;text-align:center;background:#0b0b0b;cursor:pointer}.upload-box:hover{border-color:#777;background:#111}.helper{font-size:11px;color:#666;margin-top:5px}@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:18px;z-index:20;backdrop-filter:blur(10px)}.modal.on{display:flex;animation:fade .18s ease}.box{background:linear-gradient(145deg,#151515,#0d0d0d);border:1px solid #3a3a3a;border-radius:18px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 100px #000}.mob{display:none}.empty{padding:35px;text-align:center;color:#777}.footer-mark{margin-top:26px;padding:18px 4px;border-top:1px solid #202020;display:flex;justify-content:space-between;color:#555;font-size:10px;letter-spacing:2px;text-transform:uppercase}

</style><body><aside class="side"><div class="brand"><img src="logo-eiron-branca.png" alt="EIRON"><small>STOCK · CUSTOS · PRECIFICAÇÃO</small></div><div id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span class="muted">Estoque · Custos · Precificação</span></div><button class="btn" onclick="backup()">↧ Exportar backup</button></div><div id="view"></div><div class="footer-mark"><span>EIRON STOCK</span><span>NASCIDOS DO REINO · ENVIADOS AO MUNDO</span></div></main><nav class="mob" id="mob"></nav><div class="modal" id="modal"><div class="box" id="box"></div></div><script>
const K="eiron_stock_v1",P=[["dash","⌂","Dashboard"],["prod","👕","Produtos"],["stock","▦","Estoque"],["buy","📦","Compras"],["price","₽","Precificação"],["mat","✦","Papelaria"],["set","⚙","Configurações"]];let db=JSON.parse(localStorage.getItem(K)||'{"p":[],"m":[],"b":[],"margin":50}'),page="dash";const R=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(+v||0),save=()=>localStorage.setItem(K,JSON.stringify(db));function nav(){let x=P.map(a=>`<button class="${page==a[0]?"on":""}" onclick="go('${a[0]}')">${a[1]} ${a[2]}</button>`).join("");nav.innerHTML=x;mob.innerHTML=x}function go(x){page=x;title.textContent=P.find(a=>a[0]==x)[2];nav();render()}function stock(p){return Object.values(p.s||{}).reduce((a,b)=>a+(+b||0),0)}function cost(p){return +p.piece+p.pers+p.freight+p.pack+p.paper+p.other}function render(){if(page=="dash")view.innerHTML=dash();if(page=="prod")view.innerHTML=prod();if(page=="stock")view.innerHTML=stk();if(page=="buy")view.innerHTML=buy();if(page=="price")view.innerHTML=price();if(page=="mat")view.innerHTML=mat();if(page=="set")view.innerHTML=settings()}function dash(){let q=db.p.reduce((a,p)=>a+stock(p),0),v=db.p.reduce((a,p)=>a+stock(p)*cost(p),0),low=db.p.filter(p=>stock(p)<=5);return `<div class="hero"><img class="hero-logo" src="logo-eiron-branca.png" alt="EIRON"><div class="scribble"><b>MAIS QUE ROUPA.</b>Um sistema para carregar o propósito até os números.<br><span style="display:block;margin-top:10px;color:#777">DISCIPLINA TAMBÉM É PROPÓSITO.</span></div></div><div class="grid"><div class="card kpi"><div class="icon">▣</div><div class="muted">TOTAL DE PRODUTOS</div><div class="n">${db.p.length}</div><div class="trend">↑ catálogo EIRON</div></div><div class="card kpi"><div class="icon">↥</div><div class="muted">UNIDADES EM ESTOQUE</div><div class="n">${q}</div><div class="trend">↑ estoque atual</div></div><div class="card kpi"><div class="icon">R$</div><div class="muted">VALOR DO ESTOQUE</div><div class="n">${R(v)}</div><div class="trend">custo real acumulado</div></div><div class="card kpi"><div class="icon">✦</div><div class="muted">MATERIAIS</div><div class="n">${db.m.length}</div><div class="trend">papelaria + embalagem</div></div></div><div class="card"><div class="section-title"><h2>Ações rápidas</h2><span class="muted">movimente seu estoque</span></div><div class="quick"><button class="btn primary" onclick="newP()"><span class="qicon">＋</span>Nova peça</button><button class="btn" onclick="go('buy')"><span class="qicon">↧</span>Entrada de estoque</button><button class="btn" onclick="go('stock')"><span class="qicon">↥</span>Ver estoque</button><button class="btn" onclick="go('price')"><span class="qicon">⌁</span>Precificar</button></div></div><div class="grid"><div class="card"><div class="section-title"><h2>Produtos em destaque</h2><span class="muted">${db.p.length} cadastrados</span></div><div class="activity" style="margin-top:10px">${db.p.slice(0,5).map(p=>`<div class="row"><div style="flex:1"><b>${p.name||'Sem nome'}</b><br><span class="muted">REF: ${p.code||'—'}</span></div><span class="pill ${stock(p)<=5?'low':''}">${stock(p)} un</span><strong>${R(p.price)}</strong></div>`).join('')||'<div class="empty">Cadastre sua primeira peça.</div>'}</div></div><div class="card"><div class="section-title"><h2>Alertas de estoque</h2><span class="muted">até 5 unidades</span></div><div class="activity" style="margin-top:10px">${low.slice(0,5).map(p=>`<div class="row"><div class="dot">!</div><div><b>${p.name||'Sem nome'}</b><br><span class="muted">${stock(p)} unidade(s) disponíveis</span></div></div>`).join('')||'<div class="empty">Estoque saudável. Nenhum alerta.</div>'}</div></div></div>`}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function parseMoney(v){if(typeof v==='number')return v||0;let t=String(v??'').replace(/\s/g,'').replace(/R\$/gi,'');if(t.includes(',')){t=t.replace(/\./g,'').replace(',','.')}return parseFloat(t)||0}
function moneyField(id,val=0,placeholder='0,00'){return `<div class="money-wrap"><input id="${id}" inputmode="decimal" autocomplete="off" value="${R(val).replace('R$','').trim()}" placeholder="${placeholder}"></div>`}
function bindMoney(id){let el=document.getElementById(id);if(!el)return;el.addEventListener('focus',()=>{el.value=el.value.replace(/R\$/g,'').trim()});el.addEventListener('input',()=>{let raw=el.value.replace(/[^0-9,.-]/g,'');el.value=raw});el.addEventListener('blur',()=>{el.value=R(parseMoney(el.value)).replace('R$','').trim()})}
function moneyValue(id){return parseMoney(document.getElementById(id)?.value||0)}
function prod(){return `<div class="section-title"><div><h2>Produtos</h2><span class="muted">Peças, imagens, custos e preços</span></div><button class="btn primary" onclick="newP()">＋ Nova peça</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Produto</th><th>Custo real</th><th>Venda</th><th>Estoque</th></tr>${db.p.map(p=>`<tr><td><div class="product-cell"><img class="product-thumb" src="${p.img||'icon-192.png'}" alt=""><div><b>${esc(p.name)||'Sem nome'}</b><br><span class="muted">${esc(p.code)||'Sem código'}</span>${p.desc?`<span class="muted desc">${esc(p.desc)}</span>`:''}</div></div></td><td>${R(cost(p))}</td><td>${R(p.price)}</td><td><span class="pill ${stock(p)<=5?'low':''}">${stock(p)}</span></td></tr>`).join('')||"<tr><td colspan=4 class=empty>Nenhuma peça cadastrada.</td></tr>"}</table></div></div>`}
function catalogOptions(type){return db.m.filter(m=>m.t===type).map(m=>`<option value="${esc(m.id)}" data-cost="${m.u||0}">${esc(m.n)} • ${R(m.u)}</option>`).join('')}
function newP(){let img='';modal(`<h2>Nova peça</h2><div class="form"><div class="field full"><label>Imagem do produto</label><label class="upload-box" for="imgFile">＋ Adicionar imagem<br><span class="helper">JPG, PNG ou WEBP · máximo recomendado 2 MB</span></label><input id="imgFile" type="file" accept="image/*" style="display:none"><img id="imgPreview" class="preview" alt="Prévia"></div><div class="field"><label>Modelo *</label><input id="n" placeholder="Ex.: Camiseta Keryx"></div><div class="field"><label>Código / SKU</label><input id="c" placeholder="Ex.: V1-001"></div><div class="field full"><label>Descrição</label><textarea id="desc" rows="3" placeholder="Descreva a peça..."></textarea></div><div class="field"><label>Valor da peça *</label>${moneyField('pc')}</div><div class="field"><label>Preço de venda *</label>${moneyField('pr')}</div><div class="field"><label>Personalização</label><select id="persSel"><option value="">Sem personalização</option>${catalogOptions('Personalização')}</select></div><div class="field"><label>Papelaria</label><select id="paperSel"><option value="">Sem papelaria</option>${catalogOptions('Papelaria')}</select></div><div class="field"><label>Embalagem</label><select id="packSel"><option value="">Sem embalagem</option>${catalogOptions('Embalagem')}</select></div><div class="field"><label>Frete desta peça</label>${moneyField('fr')}</div><div class="field"><label>Outros custos</label>${moneyField('ou')}</div><div class="field full"><label>Estoque inicial por tamanho</label><div class="stock-grid"><div class="stock-box"><span>M</span><input id="m" type="number" min="0" value="0"></div><div class="stock-box"><span>G</span><input id="g" type="number" min="0" value="0"></div><div class="stock-box"><span>GG</span><input id="gg" type="number" min="0" value="0"></div><div class="stock-box"><span>XG</span><input id="xg" type="number" min="0" value="0"></div></div></div></div><div class="helper">Os valores de personalização, papelaria e embalagem vêm diretamente dos cadastros e entram automaticamente no custo.</div><div class="small-actions" style="margin-top:15px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveP()">Salvar peça</button></div>`);['pc','pr','fr','ou'].forEach(bindMoney);document.getElementById('imgFile').addEventListener('change',e=>{let f=e.target.files?.[0];if(!f)return;if(f.size>5*1024*1024){alert('Imagem muito grande. Escolha uma de até 5 MB.');return}let r=new FileReader();r.onload=()=>{img=r.result;let p=document.getElementById('imgPreview');p.src=img;p.style.display='block'};r.readAsDataURL(f)})}
function selectedCost(id){let m=db.m.find(x=>x.id===document.getElementById(id)?.value);return m?+m.u||0:0}
function saveP(){let pers=selectedCost('persSel'),paper=selectedCost('paperSel'),pack=selectedCost('packSel');db.p.push({id:crypto.randomUUID(),name:n.value.trim(),code:c.value.trim(),desc:desc.value.trim(),piece:moneyValue('pc'),pers,freight:moneyValue('fr'),pack,paper,other:moneyValue('ou'),price:moneyValue('pr'),persId:persSel.value,paperId:paperSel.value,packId:packSel.value,img:window.__eironImg||document.getElementById('imgPreview')?.src||'',s:{M:+m.value||0,G:+g.value||0,GG:+gg.value||0,XG:+xg.value||0}});save();closeM();render()}
function stk(){return `<div class="section-title"><div><h2>Estoque</h2><span class="muted">Controle por tamanho em caixas rápidas</span></div></div><div class="grid">${db.p.map(p=>`<div class="card"><div class="product-cell"><img class="product-thumb" src="${p.img||'icon-192.png'}" alt=""><div><b>${esc(p.name)||'Sem nome'}</b><br><span class="muted">${esc(p.code)||'—'}</span></div></div><div class="stock-grid" style="grid-template-columns:repeat(4,1fr)">${['M','G','GG','XG'].map(z=>`<div class="stock-box"><span>${z}</span><strong>${p.s?.[z]||0}</strong></div>`).join('')}</div><div style="margin-top:10px"><span class="pill ${stock(p)<=5?'low':''}">${stock(p)} un total</span></div></div>`).join('')||'<div class="card empty">Nenhuma peça cadastrada.</div>'}</div>`}
function newB(){modal(`<h2>Nova compra / frete</h2><div class="form"><div class="field"><label>Fornecedor</label><input id="bs" placeholder="Nome do fornecedor"></div><div class="field"><label>Quantidade de peças</label><input id="bq" type="number" min="0" value="0"></div><div class="field"><label>Valor das peças</label>${moneyField('bv')}</div><div class="field"><label>Frete total do pacote</label>${moneyField('bf')}</div><div class="field full"><label>Itens / observação</label><input id="bi" placeholder="Ex.: 10 camisetas + embalagens"></div></div><div class="helper">O frete é registrado como valor único do pacote e depois pode ser distribuído por unidade na composição de custos.</div><div class="small-actions" style="margin-top:15px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveB()">Registrar compra</button></div>`);['bv','bf'].forEach(bindMoney)}
function saveB(){db.b.push({id:crypto.randomUUID(),s:bs.value,i:bi.value,q:+bq.value||0,v:moneyValue('bv'),f:moneyValue('bf'),date:new Date().toISOString()});save();closeM();render()}
function buy(){return `<div class="section-title"><div><h2>Compras & Fretes</h2><span class="muted">Frete individual ou por pacote</span></div><button class="btn primary" onclick="newB()">＋ Nova compra</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Fornecedor</th><th>Itens</th><th>Peças</th><th>Frete</th><th>Total</th></tr>${db.b.map(b=>`<tr><td><b>${esc(b.s)||'—'}</b></td><td>${esc(b.i)||'—'}</td><td>${b.q}</td><td>${R(b.f)}</td><td><b>${R((+b.v||0)+(+b.f||0))}</b></td></tr>`).join('')||"<tr><td colspan=5 class=empty>Nenhuma compra registrada.</td></tr>"}</table></div></div>`}
function calc(){let p=db.p.find(x=>x.id===sel.value);if(!p){res.innerHTML='<span class="muted">Selecione uma peça para calcular.</span>';return}let c=cost(p),price=c*(1+(+db.margin||0)/100);res.innerHTML=`<div class="grid"><div><span class="muted">Custo real</span><h2>${R(c)}</h2></div><div><span class="muted">Preço sugerido</span><h2>${R(price)}</h2></div></div><div class="helper">Inclui peça + personalização + frete + embalagem + papelaria + outros custos.</div>`}
function price(){return `<div class="section-title"><div><h2>Precificação</h2><span class="muted">Custo real + margem</span></div></div><div class="card"><div class="field"><label>Peça</label><select id="sel" onchange="calc()"><option value="">Selecione uma peça</option>${db.p.map(p=>`<option value="${p.id}">${esc(p.name)||'Sem nome'} • ${R(cost(p))}</option>`).join('')}</select></div><div id="res" class="card"><span class="muted">Selecione uma peça para calcular.</span></div></div>`}
function mat(){return `<div class="section-title"><div><h2>Papelaria & Embalagem</h2><span class="muted">Cadastre aqui os itens que aparecem automaticamente no cadastro das peças</span></div><button class="btn primary" onclick="newM()">＋ Novo item</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Item</th><th>Tipo</th><th>Fornecedor</th><th>Custo unit.</th><th>Estoque</th></tr>${db.m.map(m=>`<tr><td><b>${esc(m.n)||'Sem nome'}</b></td><td><span class="catalog-badge">${esc(m.t)}</span></td><td>${esc(m.s)||'—'}</td><td>${R(m.u)}</td><td><span class="pill ${m.q<=5?'low':''}">${m.q}</span></td></tr>`).join('')||"<tr><td colspan=5 class=empty>Nenhum item cadastrado.</td></tr>"}</table></div></div>`}
function newM(){modal(`<h2>Novo item de cadastro</h2><div class="form"><div class="field"><label>Nome do item *</label><input id="mn" placeholder="Ex.: Tag EIRON"></div><div class="field"><label>Tipo *</label><select id="mt"><option>Personalização</option><option>Papelaria</option><option>Embalagem</option></select></div><div class="field"><label>Fornecedor</label><input id="ms" placeholder="Fornecedor"></div><div class="field"><label>Custo unitário *</label>${moneyField('mu')}</div><div class="field"><label>Estoque inicial</label><input id="mq" type="number" min="0" value="0"></div></div><div class="helper">Depois de cadastrado, este item aparece como opção selecionável no cadastro das peças e seu custo entra automaticamente.</div><div class="small-actions" style="margin-top:15px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveM()">Salvar cadastro</button></div>`);bindMoney('mu')}
function saveM(){db.m.push({id:crypto.randomUUID(),n:mn.value.trim(),t:mt.value,s:ms.value.trim(),u:moneyValue('mu'),q:+mq.value||0});save();closeM();render()}
function settings(){return `<div class="section-title"><div><h2>Configurações</h2><span class="muted">Parâmetros do sistema</span></div></div><div class="card"><div class="field"><label>Margem padrão (%)</label><input id="mar" type="number" value="${db.margin}"></div><button class="btn primary" style="margin-top:12px" onclick="db.margin=+mar.value||0;save();render()">Salvar configurações</button></div>`}
function modal(x){box.innerHTML=x;modalEl=document.querySelector(".modal");modalEl.classList.add("on")}function closeM(){document.querySelector(".modal").classList.remove("on")}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="eiron-stock-backup.json";a.click()}nav();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script></body></html>
