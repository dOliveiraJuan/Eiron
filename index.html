<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EIRON STOCK">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta name="eiron-version" content="6.0-cachefix"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>EIRON STOCK · V6</title>
<style>
:root{--bg:#070707;--panel:#101010;--panel2:#151515;--line:#292929;--text:#f1ede4;--muted:#8d8d8d;--green:#32d583;--red:#ff626b;--yellow:#f5c84c;--blue:#59a9ff}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 75% 0,#181818 0,#090909 30%,#050505 80%);color:var(--text);font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;overflow-x:hidden}button,input,select,textarea{font:inherit}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:240px;padding:24px 14px;border-right:1px solid #242424;background:linear-gradient(180deg,#080808,#0d0d0d);z-index:20}.brand{padding:4px 8px 22px}.brand img{width:165px;display:block;margin:auto;filter:drop-shadow(0 10px 25px #000);animation:logoIn .7s ease}.brand small{display:block;text-align:center;color:#666;font-size:8px;letter-spacing:2px;margin-top:10px}.side nav{display:grid;gap:5px}.side button,.mob button{border:1px solid transparent;background:transparent;color:#888;border-radius:11px;padding:12px 13px;text-align:left;cursor:pointer;transition:.22s;display:flex;gap:11px;align-items:center}.side button:hover{background:#151515;color:#fff;transform:translateX(4px)}.side button.on,.mob button.on{background:linear-gradient(135deg,#f1ede4,#d7d1c6);color:#080808;box-shadow:0 12px 30px #0008}.ico{width:22px;text-align:center}.main{margin-left:240px;padding:24px 28px 60px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.top h1{margin:0;font-size:28px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid #343434;background:#151515;color:#fff;padding:10px 14px;border-radius:11px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);border-color:#666;box-shadow:0 8px 24px #0008}.btn.primary{background:var(--text);color:#080808;border-color:var(--text)}.btn.danger{background:#2a1113;border-color:#5c252a;color:#ff9ca3}.btn.green{background:#103520;border-color:#1c7042;color:#65e9a2}.hero{position:relative;overflow:hidden;padding:24px;border:1px solid #2a2a2a;border-radius:20px;min-height:155px;background:linear-gradient(120deg,#0c0c0c,#161616,#090909);box-shadow:0 25px 80px #0009}.hero-logo{width:min(250px,60%);display:block;animation:float 5s ease-in-out infinite}.hero:after{content:"";position:absolute;right:-100px;top:-100px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#fff1,transparent 60%);opacity:.05}.scribble{position:absolute;right:26px;top:26px;text-align:right;color:#aaa;max-width:190px;font-size:12px}.scribble b{display:block;color:#fff;font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:13px}.card{background:linear-gradient(145deg,#121212,#0d0d0d);border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:13px;box-shadow:0 12px 40px #0007;transition:.22s}.card:hover{border-color:#3a3a3a}.kpi{position:relative;overflow:hidden}.kpi .n{font-size:25px;font-weight:850;margin-top:7px}.kpi .trend{font-size:11px;color:var(--green);margin-top:7px}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.quick .btn{min-height:70px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.qicon{font-size:24px;margin-bottom:6px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-title h2{margin:0;font-size:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em;text-align:left}.table th,.table td{padding:11px 7px;border-bottom:1px solid #242424}.table tr:last-child td{border-bottom:0}.product-cell{display:flex;align-items:center;gap:11px}.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#181818;border:1px solid #303030}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#10331f;border:1px solid #1b6b40;color:#55e89b;font-size:11px}.pill.low{background:#342d0d;border-color:#715d16;color:#ffdb5b}.pill.red{background:#361316;border-color:#6d242a;color:#ff989e}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.field label{display:block;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#0a0a0a;color:#fff;border:1px solid #333;border-radius:10px;padding:11px;outline:none}.field textarea{resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#777;box-shadow:0 0 0 3px #fff1}.money{position:relative}.money:before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa;font-weight:800;z-index:1}.money input{padding-left:38px}.stock-row,.chip-row{display:flex;flex-wrap:wrap;gap:8px}.stock-box{width:68px;border:1px solid #333;background:#0a0a0a;border-radius:10px;padding:8px;text-align:center}.stock-box b{display:block;font-size:10px;color:#777;margin-bottom:5px}.stock-box input{width:100%;padding:8px 4px;text-align:center}.chip{position:relative;border:1px solid #383838;background:#101010;color:#aaa;border-radius:999px;padding:9px 13px;cursor:pointer;transition:.18s}.chip input{position:absolute;opacity:0;pointer-events:none}.chip.active{border-color:#f1ede4;background:#f1ede4;color:#080808}.kv-list{display:grid;gap:8px}.kv{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.kv .btn{padding:8px 10px}.catalog-list{display:grid;gap:7px;margin-top:12px}.catalog-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid #292929;background:#0d0d0d;border-radius:10px}.cost-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cost-line{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:8px 0}.cost-total{font-size:19px;font-weight:850;margin-top:8px}.modal{position:fixed;inset:0;background:#000d;backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.modal.on{display:flex;animation:fade .18s}.box{width:min(900px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#161616,#0c0c0c);border:1px solid #3b3b3b;border-radius:18px;padding:20px;box-shadow:0 30px 100px #000}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.preview{width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px dashed #555;display:none}.upload{border:1px dashed #555;border-radius:12px;padding:20px;text-align:center;background:#0b0b0b;cursor:pointer}.helper{font-size:11px;color:#666;margin-top:5px}.empty{text-align:center;color:#666;padding:28px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.activity{display:grid;gap:2px}.activity-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #222}.dot{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:#10331f;color:#58e99d}.dot.out{background:#351316;color:#ff8d94}.footer{margin-top:24px;padding:18px 3px;border-top:1px solid #222;color:#555;font-size:9px;letter-spacing:2px;display:flex;justify-content:space-between}.mob{display:none}@keyframes logoIn{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:800px){.side{display:none}.main{margin:0;padding:14px 12px 90px}.mob{display:flex;position:fixed;left:0;right:0;bottom:0;padding:6px;background:#0b0b0bf2;border-top:1px solid #333;z-index:40;backdrop-filter:blur(15px);overflow:auto}.mob button{min-width:74px;justify-content:center;flex-direction:column;gap:3px;padding:7px 5px;font-size:10px}.grid{grid-template-columns:1fr 1fr;gap:9px}.quick{grid-template-columns:repeat(2,1fr)}.hero{min-height:135px;padding:18px}.hero-logo{width:52%;max-width:190px}.scribble{right:13px;top:17px;font-size:9px;max-width:120px}.scribble b{font-size:12px}.form{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:13px}.top h1{font-size:23px}.top .btn{display:none}.cost-summary{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr auto}.footer{font-size:7px}.brand img{width:150px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><img src="logo-eiron-branca.png" alt="EIRON"><small>STOCK · CUSTOS · PRECIFICAÇÃO</small></div><nav id="sideNav"></nav></aside>
<main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span class="muted">Estoque · Custos · Precificação</span></div><button class="btn" onclick="backup()">↧ Backup</button></div><div id="view"></div><div class="footer"><span>EIRON STOCK</span><span>NASCIDOS DO REINO · ENVIADOS AO MUNDO</span></div></main>
<nav class="mob" id="mobNav"></nav>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
</div>
<script>
const KEY='eiron_stock_v5';
const NAV=[['dash','⌂','Dashboard'],['prod','👕','Produtos'],['stock','▦','Estoque'],['sales','↗','Vendas'],['buy','📦','Compras & Fretes'],['price','⌁','Precificação'],['cat','✦','Cadastros'],['set','⚙','Configurações']];
const legacy=JSON.parse(localStorage.getItem('eiron_stock_v1')||'null');
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[],catalog:[],freights:[],sales:[],movements:[],margin:50};
if(!db.products.length && legacy?.p?.length){db.products=legacy.p.map(p=>({id:p.id||crypto.randomUUID(),name:p.name||'',code:p.code||'',model:p.name||'',description:p.desc||'',details:[],piece:+p.piece||0,price:+p.price||0,image:p.img||'',sizes:{M:+(p.s?.M||0),G:+(p.s?.G||0),GG:+(p.s?.GG||0),XG:+(p.s?.XG||0)},colors:[],personalizations:p.persId?[p.persId]:[],stationery:p.paperId?[p.paperId]:[],packaging:p.packId?[p.packId]:[],other:+p.other||0,costFreight:0,createdAt:new Date().toISOString()}));}
if(!db.catalog.length && legacy?.m?.length){db.catalog=legacy.m.map(m=>({id:m.id||crypto.randomUUID(),type:m.t==='Personalização'?'personalizacao':m.t==='Papelaria'?'papelaria':'embalagem',name:m.n||'',unitCost:+m.u||0,reserveQty:0,stock:+m.q||0,createdAt:new Date().toISOString()}));}
let page='dash';
const $=id=>document.getElementById(id);
const R=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function moneyNum(v){if(typeof v==='number')return v||0;let s=String(v??'').replace(/\s|R\$/gi,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0;}
function moneyField(id,val=0){return `<div class="money"><input id="${id}" inputmode="decimal" autocomplete="off" value="${moneyNum(val)?R(val).replace('R$','').trim():''}" placeholder="0,00"></div>`}
function bindMoney(id){let e=$(id);if(!e)return;e.addEventListener('focus',()=>e.value=e.value.replace(/R\$/gi,'').trim());e.addEventListener('input',()=>e.value=e.value.replace(/[^0-9,.-]/g,''));e.addEventListener('blur',()=>e.value=R(moneyNum(e.value)).replace('R$','').trim());}
function modal(html){$('modalBox').innerHTML=html;$('modal').classList.add('on')}
function closeM(){$('modal').classList.remove('on')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function nav(){let h=NAV.map(n=>`<button class="${page===n[0]?'on':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span><span>${n[2]}</span></button>`).join('');$('sideNav').innerHTML=h;$('mobNav').innerHTML=h}
function go(p){page=p;$('title').textContent=NAV.find(n=>n[0]===p)?.[2]||'Dashboard';nav();render()}
function totalStock(p){return Object.values(p.sizes||{}).reduce((a,b)=>a+(+b||0),0)}
function catalogBy(id){return db.catalog.find(c=>c.id===id)}
function itemCost(ids){return (ids||[]).reduce((s,id)=>s+(+(catalogBy(id)?.unitCost||0)),0)}
function freightAllocated(p){return +(p.costFreight||0)}
function realCost(p){return (+p.piece||0)+itemCost(p.personalizations)+itemCost(p.stationery)+itemCost(p.packaging)+freightAllocated(p)+(+p.other||0)}
function selectedNames(ids){return (ids||[]).map(id=>catalogBy(id)?.name).filter(Boolean)}
function render(){nav();let f={dash:dash,prod:prod,stock:stockPage,sales:sales,buy:buy,price:price,cat:catalog,set:settings}[page];$('view').innerHTML=f?f():''}
function dash(){let units=db.products.reduce((s,p)=>s+totalStock(p),0),inv=db.products.reduce((s,p)=>s+totalStock(p)*realCost(p),0),low=db.products.filter(p=>totalStock(p)<=5);return `<div class="hero"><img class="hero-logo" src="logo-eiron-branca.png"><div class="scribble"><b>MAIS QUE ROUPA.</b>Um sistema para carregar o propósito até os números.<br><span style="display:block;margin-top:7px;color:#777">DISCIPLINA TAMBÉM É PROPÓSITO.</span></div></div><div class="grid"><div class="card kpi"><div class="muted">TOTAL DE PRODUTOS</div><div class="n">${db.products.length}</div><div class="trend">catálogo EIRON</div></div><div class="card kpi"><div class="muted">UNIDADES EM ESTOQUE</div><div class="n">${units}</div><div class="trend">estoque atual</div></div><div class="card kpi"><div class="muted">VALOR DO ESTOQUE</div><div class="n">${R(inv)}</div><div class="trend">custo real acumulado</div></div><div class="card kpi"><div class="muted">ITENS CADASTRADOS</div><div class="n">${db.catalog.length}</div><div class="trend">personalização + papelaria + embalagem</div></div></div><div class="card"><div class="section-title"><h2>Ações rápidas</h2><span class="muted">movimente seu estoque</span></div><div class="quick"><button class="btn primary" onclick="newProduct()"><span class="qicon">＋</span>Nova peça</button><button class="btn" onclick="newSale()"><span class="qicon">↗</span>Nova venda</button><button class="btn" onclick="go('stock')"><span class="qicon">▦</span>Editar estoque</button><button class="btn" onclick="newFreight()"><span class="qicon">🚚</span>Registrar frete</button><button class="btn" onclick="go('cat')"><span class="qicon">✦</span>Cadastros</button></div></div><div class="grid2"><div class="card"><div class="section-title"><h2>Produtos em destaque</h2><span class="muted">${db.products.length} cadastrados</span></div><div class="activity">${db.products.slice(0,5).map(p=>`<div class="activity-row"><img class="thumb" src="${p.image||'icon-192.png'}"><div style="flex:1"><b>${esc(p.name)||'Sem nome'}</b><br><span class="muted">${esc(p.description||p.code||'Sem descrição')}</span></div><span class="pill ${totalStock(p)<=5?'low':''}">${totalStock(p)} un</span><strong>${R(p.price)}</strong></div>`).join('')||'<div class="empty">Cadastre sua primeira peça.</div>'}</div></div><div class="card"><div class="section-title"><h2>Estoque baixo</h2><span class="muted">até 5 unidades</span></div><div class="activity">${low.slice(0,5).map(p=>`<div class="activity-row"><div class="dot">!</div><div><b>${esc(p.name)}</b><br><span class="muted">${totalStock(p)} unidade(s)</span></div></div>`).join('')||'<div class="empty">Estoque saudável.</div>'}</div></div></div>`}
function prod(){return `<div class="section-title"><div><h2>Produtos</h2><span class="muted">Imagem, modelo, descrição, cores, tamanhos e custo real</span></div><button class="btn primary" onclick="newProduct()">＋ Nova peça</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Produto</th><th>Modelo / cor</th><th>Custo real</th><th>Venda</th><th>Estoque</th><th></th></tr>${db.products.map(p=>`<tr><td><div class="product-cell"><img class="thumb" src="${p.image||'icon-192.png'}"><div><b>${esc(p.name)||'Sem nome'}</b><br><span class="muted">${esc(p.code||'Sem SKU')}</span><br><span class="muted">${esc(p.description||'Sem descrição')}</span></div></div></td><td>${esc(p.model||'—')}<br><span class="muted">${selectedNames(p.colors).join(', ')||'Sem cor'}</span></td><td>${R(realCost(p))}</td><td>${R(p.price)}</td><td><span class="pill ${totalStock(p)<=5?'low':''}">${totalStock(p)}</span></td><td><button class="btn" onclick="editProduct('${p.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma peça cadastrada.</td></tr>'}</table></div></div>`}
function stockPage(){return `<div class="section-title"><div><h2>Estoque</h2><span class="muted">Edite quantidades por tamanho quando precisar</span></div></div><div class="grid">${db.products.map(p=>`<div class="card"><div class="product-cell"><img class="thumb" src="${p.image||'icon-192.png'}"><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.code||'—')}</span></div></div><div class="stock-row" style="margin-top:12px">${['P','M','G','GG','XG'].map(z=>`<div class="stock-box"><b>${z}</b><input type="number" min="0" value="${+(p.sizes?.[z]||0)}" onchange="setStock('${p.id}','${z}',this.value)"></div>`).join('')}</div><div class="actions"><button class="btn green" onclick="adjustStock('${p.id}',1)">＋ Entrada</button><button class="btn danger" onclick="adjustStock('${p.id}',-1)">− Saída</button><span class="pill ${totalStock(p)<=5?'low':''}">${totalStock(p)} total</span></div></div>`).join('')||'<div class="card empty">Nenhuma peça cadastrada.</div>'}</div>`}
function setStock(id,z,v){let p=db.products.find(x=>x.id===id);if(!p)return;let old=+(p.sizes[z]||0),n=Math.max(0,+v||0);p.sizes[z]=n;db.movements.unshift({id:crypto.randomUUID(),type:n-old>=0?'entrada':'saída',productId:id,size:z,qty:Math.abs(n-old),note:'Ajuste manual',date:new Date().toISOString()});save();render()}
function adjustStock(id,delta){let p=db.products.find(x=>x.id===id);if(!p)return;modal(`<div class="modal-head"><h2>${delta>0?'Entrada':'Saída'} de estoque</h2><button class="btn" onclick="closeM()">×</button></div><div class="field"><label>Tamanho</label><select id="adjSize">${['P','M','G','GG','XG'].map(z=>`<option>${z}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Quantidade</label><input id="adjQty" type="number" min="1" value="1"></div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn ${delta>0?'green':'danger'}" onclick="applyAdjust('${id}',${delta})">Confirmar</button></div>`)}
function applyAdjust(id,delta){let p=db.products.find(x=>x.id===id),z=$('adjSize').value,q=Math.max(1,+$('adjQty').value||1),old=+(p.sizes[z]||0),n=delta>0?old+q:Math.max(0,old-q);p.sizes[z]=n;db.movements.unshift({id:crypto.randomUUID(),type:delta>0?'entrada':'saída',productId:id,size:z,qty:Math.abs(n-old),note:'Ajuste manual',date:new Date().toISOString()});save();closeM();render()}
function sales(){return `<div class="section-title"><div><h2>Vendas</h2><span class="muted">Venda por item e tamanho reduz o estoque automaticamente</span></div><button class="btn primary" onclick="newSale()">＋ Nova venda</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Data</th><th>Produto</th><th>Tamanho</th><th>Qtd.</th><th>Valor</th><th>Pagamento</th></tr>${db.sales.map(s=>{let p=db.products.find(x=>x.id===s.productId);return `<tr><td>${new Date(s.date).toLocaleString('pt-BR')}</td><td><b>${esc(p?.name||s.productName)}</b></td><td>${s.size}</td><td>${s.qty}</td><td>${R(s.total)}</td><td>${esc(s.payment)}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Nenhuma venda registrada.</td></tr>'}</table></div></div>`}
function newSale(){modal(`<div class="modal-head"><h2>Nova venda</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><div class="field full"><label>Produto *</label><select id="saleProd" onchange="updateSaleSizes()"><option value="">Selecione</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} • ${R(p.price)}</option>`).join('')}</select></div><div class="field"><label>Tamanho *</label><select id="saleSize"></select></div><div class="field"><label>Quantidade *</label><input id="saleQty" type="number" min="1" value="1"></div><div class="field"><label>Valor unitário</label>${moneyField('saleUnit')}</div><div class="field"><label>Pagamento</label><select id="salePay"><option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Outro</option></select></div><div class="field"><label>Cliente (opcional)</label><input id="saleClient" placeholder="Nome"></div></div><div class="helper">Ao confirmar, a quantidade é retirada automaticamente do tamanho selecionado.</div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveSale()">Registrar venda</button></div>`);bindMoney('saleUnit');updateSaleSizes()}
function updateSaleSizes(){let p=db.products.find(x=>x.id===$('saleProd')?.value),s=$('saleSize');if(!s)return;s.innerHTML=p?['P','M','G','GG','XG'].map(z=>`<option value="${z}">${z} • ${+(p.sizes[z]||0)} em estoque</option>`).join(''):'<option>Selecione</option>';if(p)$('saleUnit').value=R(p.price).replace('R$','').trim()}
function saveSale(){let p=db.products.find(x=>x.id===$('saleProd').value),z=$('saleSize').value,q=Math.max(1,+$('saleQty').value||1),unit=moneyNum($('saleUnit').value);if(!p){alert('Selecione um produto.');return}if((+(p.sizes[z]||0))<q){alert('Estoque insuficiente para esse tamanho.');return}p.sizes[z]-=q;db.sales.unshift({id:crypto.randomUUID(),productId:p.id,productName:p.name,size:z,qty:q,unit,total:unit*q,payment:$('salePay').value,client:$('saleClient').value.trim(),date:new Date().toISOString()});db.movements.unshift({id:crypto.randomUUID(),type:'saída',productId:p.id,size:z,qty:q,note:'Venda',date:new Date().toISOString()});save();closeM();render()}
function buy(){return `<div class="section-title"><div><h2>Compras & Fretes</h2><span class="muted">Frete separado do produto, individual ou em pacote</span></div><button class="btn primary" onclick="newFreight()">＋ Registrar frete</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Frete</th><th>Distribuição</th></tr>${db.freights.map(f=>`<tr><td>${new Date(f.date).toLocaleDateString('pt-BR')}</td><td>${f.mode==='package'?'Pacote':'Item'}</td><td>${esc(f.note||'—')}</td><td>${R(f.value)}</td><td>${f.allocation==='unit'?'Por unidade':'No cadastro'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum frete registrado.</td></tr>'}</table></div></div>`}
function newFreight(){modal(`<div class="modal-head"><h2>Registrar frete</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><div class="field"><label>Tipo</label><select id="fm"><option value="item">Frete de uma peça/cadastro</option><option value="package">Frete de pacote</option></select></div><div class="field"><label>Valor do frete</label>${moneyField('fv')}</div><div class="field"><label>Distribuir como</label><select id="fa"><option value="unit">Dividir por quantidade de itens</option><option value="cadastro">Adicionar ao cadastro selecionado</option></select></div><div class="field full"><label>Observação</label><input id="fn" placeholder="Ex.: Frete fornecedor X / pacote com 20 itens"></div><div class="field full"><label>Itens do pacote (se quiser distribuir agora)</label><select id="fproducts" multiple size="5">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} • ${totalStock(p)} un</option>`).join('')}</select><div class="helper">Selecione os itens que receberam o frete. O sistema divide o valor pelo total de unidades selecionadas.</div></div></div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveFreight()">Salvar frete</button></div>`);bindMoney('fv')}
function saveFreight(){let value=moneyNum($('fv').value),ids=[...$('fproducts').selectedOptions].map(o=>o.value),alloc=$('fa').value;if(value<=0){alert('Informe o valor do frete.');return}let per=0;if(alloc==='unit'&&ids.length){let units=ids.reduce((s,id)=>s+totalStock(db.products.find(p=>p.id===id)),0);per=units?value/units:0;ids.forEach(id=>{let p=db.products.find(p=>p.id===id);p.costFreight=(+p.costFreight||0)+per});}db.freights.unshift({id:crypto.randomUUID(),mode:$('fm').value,value,allocation:alloc,note:$('fn').value.trim(),productIds:ids,perUnit:per,date:new Date().toISOString()});save();closeM();render()}
function price(){return `<div class="section-title"><div><h2>Precificação</h2><span class="muted">Custo automático de tudo que foi selecionado</span></div></div><div class="card"><div class="field"><label>Peça</label><select id="priceProd" onchange="calcPrice()"><option value="">Selecione</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div id="priceRes" class="card"><span class="muted">Selecione uma peça.</span></div></div>`}
function calcPrice(){let p=db.products.find(x=>x.id===$('priceProd')?.value);if(!p){$('priceRes').innerHTML='<span class="muted">Selecione uma peça.</span>';return}let piece=+p.piece||0,pers=itemCost(p.personalizations),paper=itemCost(p.stationery),pack=itemCost(p.packaging),freight=freightAllocated(p),other=+p.other||0,total=piece+pers+paper+pack+freight+other,suggest=total*(1+(+db.margin||0)/100);$('priceRes').innerHTML=`<h3 style="margin-top:0">Resumo automático</h3><div class="cost-summary"><div><div class="cost-line"><span>Peça</span><b>${R(piece)}</b></div><div class="cost-line"><span>Personalização</span><b>${R(pers)}</b></div><div class="cost-line"><span>Papelaria</span><b>${R(paper)}</b></div></div><div><div class="cost-line"><span>Embalagem</span><b>${R(pack)}</b></div><div class="cost-line"><span>Frete rateado</span><b>${R(freight)}</b></div><div class="cost-line"><span>Outros</span><b>${R(other)}</b></div></div></div><div class="cost-total">Custo real: ${R(total)}</div><div style="margin-top:7px">Preço cadastrado: <b>${R(p.price)}</b> · Sugestão com ${db.margin||0}%: <b>${R(suggest)}</b></div><div class="helper">Itens selecionados: ${[...selectedNames(p.personalizations),...selectedNames(p.stationery),...selectedNames(p.packaging)].join(' · ')||'Nenhum adicional'}</div>`}
function catalog(){let types=[['personalizacao','Personalizações'],['papelaria','Papelaria'],['embalagem','Embalagens'],['cor','Cores'],['tamanho','Tamanhos'],['modelo','Modelos']];return `<div class="section-title"><div><h2>Cadastros</h2><span class="muted">Cadastre uma vez e depois apenas selecione na peça</span></div><button class="btn primary" onclick="newCatalog()">＋ Novo cadastro</button></div><div class="grid2">${types.map(t=>`<div class="card"><div class="section-title"><h2>${t[1]}</h2><span class="pill">${db.catalog.filter(x=>x.type===t[0]).length}</span></div><div class="catalog-list">${db.catalog.filter(x=>x.type===t[0]).map(c=>`<div class="catalog-item"><div><b>${esc(c.name)}</b>${['personalizacao','papelaria','embalagem'].includes(c.type)?`<br><span class="muted">${R(c.unitCost)} · reservado: ${c.reserveQty||0} · estoque: ${c.stock||0}</span>`:''}</div><button class="btn" onclick="editCatalog('${c.id}')">Editar</button></div>`).join('')||'<div class="empty">Nenhum item cadastrado.</div>'}</div></div>`).join('')}</div>`}
function newCatalog(){modal(catalogForm());bindMoney('cu')}
function catalogForm(c={}){let type=c.type||'personalizacao';return `<div class="modal-head"><h2>${c.id?'Editar':'Novo'} cadastro</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><div class="field"><label>Tipo *</label><select id="ct" onchange="toggleCatalogCost()">${[['personalizacao','Personalização'],['papelaria','Papelaria'],['embalagem','Embalagem'],['cor','Cor'],['tamanho','Tamanho'],['modelo','Modelo']].map(x=>`<option value="${x[0]}" ${type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Nome *</label><input id="cn" value="${esc(c.name||'')}" placeholder="Ex.: DTF A4"></div><div class="field cost-field"><label>Custo unitário</label>${moneyField('cu',c.unitCost||0)}</div><div class="field"><label>Quantidade reservada</label><input id="cr" type="number" min="0" value="${+(c.reserveQty||0)}"><div class="helper">Use quando você precisa reservar um item mesmo que ele já venha junto com a peça.</div></div><div class="field"><label>Quantidade em estoque</label><input id="cq" type="number" min="0" value="${+(c.stock||0)}"></div></div><div class="helper">Personalização, papelaria e embalagem ficam disponíveis como opções no cadastro da peça. O custo cadastrado entra automaticamente no cálculo.</div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveCatalog('${c.id||''}')">Salvar cadastro</button></div>`}
function toggleCatalogCost(){let t=$('ct').value;document.querySelector('.cost-field').style.display=['personalizacao','papelaria','embalagem'].includes(t)?'block':'none'}
function saveCatalog(id){let t=$('ct').value,n=$('cn').value.trim();if(!n){alert('Digite o nome.');return}let c=id?catalogBy(id):{id:crypto.randomUUID(),createdAt:new Date().toISOString()};Object.assign(c,{type:t,name:n,unitCost:moneyNum($('cu')?.value||0),reserveQty:+$('cr').value||0,stock:+$('cq').value||0});if(!id)db.catalog.push(c);save();closeM();render()}
function editCatalog(id){modal(catalogForm(catalogBy(id)));bindMoney('cu');toggleCatalogCost()}
function options(type,selected=[]){return db.catalog.filter(c=>c.type===type).map(c=>`<label class="chip ${selected.includes(c.id)?'active':''}"><input type="checkbox" value="${c.id}" ${selected.includes(c.id)?'checked':''} onchange="this.parentElement.classList.toggle('active',this.checked)">${esc(c.name)}${['personalizacao','papelaria','embalagem'].includes(type)?` · ${R(c.unitCost)}`:''}</label>`).join('')||'<span class="muted">Nenhum cadastrado. Crie em Cadastros.</span>'}
function newProduct(){productModal({})}
function editProduct(id){productModal(db.products.find(p=>p.id===id))}
function productModal(p){p=p||{};let descRows=p.details||[];modal(`<div class="modal-head"><h2>${p.id?'Editar peça':'Nova peça'}</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><div class="field full"><label>Imagem da peça</label><label class="upload" for="pf"><span>＋ Adicionar imagem</span><br><span class="helper">JPG, PNG ou WEBP · recomendado até 2 MB</span></label><input id="pf" type="file" accept="image/*" style="display:none"><img id="pimg" class="preview" src="${p.image||''}" ${p.image?'style="display:block"':''}></div><div class="field"><label>Modelo *</label><input id="pn" value="${esc(p.model||p.name||'')}" placeholder="Ex.: Keryx"></div><div class="field"><label>Nome da peça *</label><input id="pname" value="${esc(p.name||'')}" placeholder="Ex.: Camiseta Keryx"></div><div class="field"><label>Código / SKU</label><input id="pc" value="${esc(p.code||'')}" placeholder="V1-001"></div><div class="field"><label>Valor da peça *</label>${moneyField('ppiece',p.piece||0)}</div><div class="field"><label>Preço de venda *</label>${moneyField('pprice',p.price||0)}</div><div class="field full"><label>Cores da peça · selecione uma ou mais</label><div class="chip-row">${options('cor',p.colors||[])}</div></div><div class="field full"><label>Tamanhos e estoque inicial</label><div class="stock-row">${['P','M','G','GG','XG'].map(z=>`<div class="stock-box"><b>${z}</b><input id="sz_${z}" type="number" min="0" value="${+(p.sizes?.[z]||0)}"></div>`).join('')}</div></div><div class="field full"><label>Personalização · selecione do cadastro</label><div class="chip-row">${options('personalizacao',p.personalizations||[])}</div></div><div class="field full"><label>Papelaria · selecione do cadastro</label><div class="chip-row">${options('papelaria',p.stationery||[])}</div></div><div class="field full"><label>Embalagem · selecione do cadastro</label><div class="chip-row">${options('embalagem',p.packaging||[])}</div></div><div class="field full"><label>Descrição técnica · adicione campos</label><div id="kv" class="kv-list">${descRows.map(r=>kvRow(r.key,r.value)).join('')}</div><button class="btn" style="margin-top:8px" onclick="addKV()">＋ Adicionar campo</button><div class="helper">Ex.: Tecido → 100% algodão · Modelagem → Oversized · Gola → Careca.</div></div><div class="field"><label>Outros custos</label>${moneyField('pother',p.other||0)}</div><div class="field"><label>Frete</label><div class="muted" style="padding:12px;border:1px solid #292929;border-radius:10px;background:#0a0a0a">Frete é lançado separadamente em Compras & Fretes. Total rateado atual: <b id="freightCurrent">${R(p.costFreight||0)}</b></div></div></div><div id="productCostPreview" class="card"><b>Resumo automático</b><div class="helper">Ao salvar, os custos de peça + personalização + papelaria + embalagem + frete rateado + outros serão calculados automaticamente.</div></div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button>${p.id?`<button class="btn danger" onclick="deleteProduct('${p.id}')">Excluir</button>`:''}<button class="btn primary" onclick="saveProduct('${p.id||''}')">Salvar peça</button></div>`);['ppiece','pprice','pother'].forEach(bindMoney);$('pf').addEventListener('change',e=>{let f=e.target.files?.[0];if(!f)return;if(f.size>5*1024*1024){alert('Imagem acima de 5 MB.');return}let r=new FileReader();r.onload=()=>{$('pimg').src=r.result;$('pimg').style.display='block';window.__productImg=r.result};r.readAsDataURL(f)});window.__productImg=p.image||'';updateProductPreview()}
function kvRow(k='',v=''){return `<div class="kv"><input class="kvk" value="${esc(k)}" placeholder="Nome do campo"><input class="kvv" value="${esc(v)}" placeholder="O que é"><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function addKV(){let d=document.createElement('div');d.innerHTML=kvRow();$('kv').appendChild(d.firstElementChild)}
function checked(type){return [...document.querySelectorAll(`.chip input:checked`)].filter(x=>db.catalog.find(c=>c.id===x.value)?.type===type).map(x=>x.value)}
function detailValues(){return [...document.querySelectorAll('#kv .kv')].map(r=>({key:r.querySelector('.kvk').value.trim(),value:r.querySelector('.kvv').value.trim()})).filter(x=>x.key||x.value)}
function saveProduct(id){let old=id?db.products.find(p=>p.id===id):null;let p=old||{id:crypto.randomUUID(),createdAt:new Date().toISOString()};Object.assign(p,{model:$('pn').value.trim(),name:$('pname').value.trim(),code:$('pc').value.trim(),piece:moneyNum($('ppiece').value),price:moneyNum($('pprice').value),colors:checked('cor'),sizes:{P:+$('sz_P').value||0,M:+$('sz_M').value||0,G:+$('sz_G').value||0,GG:+$('sz_GG').value||0,XG:+$('sz_XG').value||0},personalizations:checked('personalizacao'),stationery:checked('papelaria'),packaging:checked('embalagem'),details:detailValues(),description:detailValues().map(x=>`${x.key}: ${x.value}`).join(' · '),other:moneyNum($('pother').value),image:window.__productImg||old?.image||'',costFreight:+(old?.costFreight||0)});if(!p.name||!p.model){alert('Preencha modelo e nome da peça.');return}if(!old)db.products.push(p);save();closeM();render()}
function deleteProduct(id){if(!confirm('Excluir esta peça?'))return;db.products=db.products.filter(p=>p.id!==id);save();closeM();render()}
function updateProductPreview(){let el=$('pricePreview');if(el){} }
function settings(){return `<div class="section-title"><div><h2>Configurações</h2><span class="muted">Margem padrão e backup</span></div></div><div class="card"><div class="field"><label>Margem padrão (%)</label><input id="margin" type="number" min="0" value="${db.margin||0}"></div><div class="actions"><button class="btn primary" onclick="db.margin=+$('margin').value||0;save();render()">Salvar</button><button class="btn" onclick="backup()">Exportar backup</button><button class="btn danger" onclick="resetData()">Apagar dados locais</button></div></div>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='eiron-stock-backup.json';a.click()}
function resetData(){if(confirm('Apagar todos os dados deste aparelho?')){localStorage.removeItem(KEY);location.reload()}}
function updateCatalogChipCost(){}
render();
if('serviceWorker' in navigator)window.addEventListener('load',async()=>{try{const V='eiron-stock-v6';const reset=localStorage.getItem('__eiron_sw_version')!==V;const regs=await navigator.serviceWorker.getRegistrations();if(reset){for(const r of regs)await r.unregister();localStorage.setItem('__eiron_sw_version',V);if(navigator.serviceWorker.controller){location.reload();return}}await navigator.serviceWorker.register('./sw.js?v=6',{updateViaCache:'none'});}catch(e){}});
</script>
</body></html>
