<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EIRON STOCK"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><title>EIRON STOCK</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#f1ede4;font:15px system-ui}.app{display:flex;min-height:100vh}.side{width:220px;padding:22px;border-right:1px solid #292929;position:fixed;height:100vh}.logo{font-size:24px;font-weight:900;letter-spacing:4px;margin-bottom:25px}.logo small{display:block;font-size:9px;letter-spacing:2px;color:#888}.side button,.mob button{display:block;width:100%;padding:12px;border:0;background:none;color:#999;text-align:left;border-radius:9px}.side button.on,.side button:hover,.mob button.on{background:#191919;color:#fff}.main{margin-left:220px;padding:24px;width:100%;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#121212;border:1px solid #292929;border-radius:14px;padding:17px;margin-top:14px}.n{font-size:28px;font-weight:800}.muted{color:#888;font-size:12px}.btn{padding:10px 14px;border:1px solid #333;border-radius:9px;background:#181818;color:#fff}.primary{background:#f1ede4;color:#0a0a0a}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#999;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #333;background:#0d0d0d;color:#fff;border-radius:8px}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 6px;border-bottom:1px solid #292929;text-align:left}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.box{background:#121212;border:1px solid #333;border-radius:15px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}.mob{display:none}
@media(max-width:800px){.side{display:none}.main{margin:0;padding:14px 12px 75px}.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.mob{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;z-index:4;overflow:auto}.mob button{min-width:90px;text-align:center;font-size:11px}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style><body><aside class="side"><div class="logo">EIRON<small>STOCK · CUSTOS · PREÇO</small></div><div id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span class="muted">Gestão de produto EIRON</span></div><button class="btn" onclick="backup()">Exportar backup</button></div><div id="view"></div></main><nav class="mob" id="mob"></nav><div class="modal" id="modal"><div class="box" id="box"></div></div><script>
const K="eiron_stock_v1",P=[["dash","⌂","Dashboard"],["prod","👕","Produtos"],["stock","▦","Estoque"],["buy","📦","Compras"],["price","₽","Precificação"],["mat","✦","Papelaria"],["set","⚙","Configurações"]];let db=JSON.parse(localStorage.getItem(K)||'{"p":[],"m":[],"b":[],"margin":50}'),page="dash";const R=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(+v||0),save=()=>localStorage.setItem(K,JSON.stringify(db));function nav(){let x=P.map(a=>`<button class="${page==a[0]?"on":""}" onclick="go('${a[0]}')">${a[1]} ${a[2]}</button>`).join("");nav.innerHTML=x;mob.innerHTML=x}function go(x){page=x;title.textContent=P.find(a=>a[0]==x)[2];nav();render()}function stock(p){return Object.values(p.s||{}).reduce((a,b)=>a+(+b||0),0)}function cost(p){return +p.piece+p.pers+p.freight+p.pack+p.paper+p.other}function render(){if(page=="dash")view.innerHTML=dash();if(page=="prod")view.innerHTML=prod();if(page=="stock")view.innerHTML=stk();if(page=="buy")view.innerHTML=buy();if(page=="price")view.innerHTML=price();if(page=="mat")view.innerHTML=mat();if(page=="set")view.innerHTML=settings()}function dash(){let q=db.p.reduce((a,p)=>a+stock(p),0),v=db.p.reduce((a,p)=>a+stock(p)*cost(p),0);return `<div class=grid><div class=card><div class=muted>PEÇAS</div><div class=n>${db.p.length}</div></div><div class=card><div class=muted>UNIDADES</div><div class=n>${q}</div></div><div class=card><div class=muted>VALOR ESTOQUE</div><div class=n>${R(v)}</div></div><div class=card><div class=muted>MATERIAIS</div><div class=n>${db.m.length}</div></div></div><div class=card><h2>Estrutura de custo</h2><p class=muted>Peça + personalização + frete + embalagem + papelaria + outros custos.</p></div>`}function prod(){return `<button class="btn primary" onclick="newP()">+ Nova peça</button><div class=card><table class=table><tr><th>Produto</th><th>Custo real</th><th>Venda</th><th>Estoque</th></tr>${db.p.map(p=>`<tr><td><b>${p.name}</b><br><span class=muted>${p.code}</span></td><td>${R(cost(p))}</td><td>${R(p.price)}</td><td>${stock(p)}</td></tr>`).join("")||"<tr><td colspan=4>Nenhuma peça cadastrada.</td></tr>"}</table></div>`}function newP(){let x={id:crypto.randomUUID(),name:"",code:"",piece:0,pers:0,freight:0,pack:0,paper:0,other:0,price:0,s:{}};modal(`<h2>Nova peça</h2><div class=form><div class=field><label>Modelo</label><input id=n value=""></div><div class=field><label>Código</label><input id=c></div><div class=field><label>Valor da peça</label><input id=pc type=number step=.01></div><div class=field><label>Personalização</label><input id=pe type=number step=.01></div><div class=field><label>Frete</label><input id=fr type=number step=.01></div><div class=field><label>Embalagem</label><input id=pa type=number step=.01></div><div class=field><label>Papelaria</label><input id=pp type=number step=.01></div><div class=field><label>Outros custos</label><input id=ou type=number step=.01></div><div class=field><label>Preço de venda</label><input id=pr type=number step=.01></div><div class=full><label class=muted>Estoque inicial por tamanho</label><div class=form><input id=m type=number placeholder="M"><input id=g type=number placeholder="G"><input id=gg type=number placeholder="GG"><input id=xg type=number placeholder="XG"></div></div></div><p class=muted>O frete pode vir de uma compra individual ou ser alocado de um pacote.</p><button class=btn onclick="closeM()">Cancelar</button> <button class="btn primary" onclick="saveP()">Salvar</button>`)}function saveP(){db.p.push({id:crypto.randomUUID(),name:n.value,code:c.value,piece:+pc.value||0,pers:+pe.value||0,freight:+fr.value||0,pack:+pa.value||0,paper:+pp.value||0,other:+ou.value||0,price:+pr.value||0,s:{M:+m.value||0,G:+g.value||0,GG:+gg.value||0,XG:+xg.value||0}});save();closeM();render()}function stk(){return `<div class=card><h2>Estoque por tamanho</h2><table class=table><tr><th>Produto</th><th>M</th><th>G</th><th>GG</th><th>XG</th><th>Total</th></tr>${db.p.map(p=>`<tr><td>${p.name}</td><td>${p.s.M||0}</td><td>${p.s.G||0}</td><td>${p.s.GG||0}</td><td>${p.s.XG||0}</td><td><b>${stock(p)}</b></td></tr>`).join("")}</table></div>`}function buy(){return `<button class="btn primary" onclick="newB()">+ Nova compra</button><div class=card><table class=table><tr><th>Fornecedor</th><th>Itens</th><th>Peças</th><th>Frete</th><th>Total</th></tr>${db.b.map(b=>`<tr><td>${b.s}</td><td>${b.i}</td><td>${b.q}</td><td>${R(b.f)}</td><td>${R(b.v+b.f)}</td></tr>`).join("")||"<tr><td colspan=5>Nenhuma compra.</td></tr>"}</table></div>`}function newB(){modal(`<h2>Nova compra / pacote</h2><div class=form><div class=field><label>Fornecedor</label><input id=bs></div><div class=field><label>Itens</label><input id=bi placeholder="KĒRYX M×3, G×5"></div><div class=field><label>Quantidade de peças</label><input id=bq type=number value=1></div><div class=field><label>Valor das peças</label><input id=bv type=number step=.01></div><div class=field><label>Frete total do pacote</label><input id=bf type=number step=.01></div></div><p class=muted>Frete unitário: <b id=fu>R$ 0,00</b></p><button class=btn onclick=closeM()>Cancelar</button> <button class="btn primary" onclick=saveB()>Registrar</button>`)}function saveB(){let q=+bq.value||1,f=+bf.value||0,v=+bv.value||0;db.b.unshift({s:bs.value,i:bi.value,q,v,f});save();closeM();render()}function price(){return `<div class=card><h2>Precificação</h2><div class=field><label>Peça</label><select id=sel onchange=calc()><option>Selecione</option>${db.p.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select></div><div id=res class=card><span class=muted>Selecione uma peça.</span></div></div>`}function calc(){let p=db.p.find(x=>x.id==sel.value);if(!p)return;let c=cost(p),v=c*(1+db.margin/100);res.innerHTML=`<div class=muted>CUSTO REAL</div><div class=n>${R(c)}</div><hr><div class=muted>MARGEM PADRÃO</div><div>${db.margin}%</div><div class=muted>PREÇO SUGERIDO</div><div class=n>${R(v)}</div><div class=muted>LUCRO BRUTO</div><div>${R(v-c)}</div>`}function mat(){return `<button class="btn primary" onclick="newM()">+ Novo material</button><div class=card><table class=table><tr><th>Item</th><th>Tipo</th><th>Fornecedor</th><th>Custo unit.</th><th>Estoque</th></tr>${db.m.map(m=>`<tr><td>${m.n}</td><td>${m.t}</td><td>${m.s}</td><td>${R(m.u)}</td><td>${m.q}</td></tr>`).join("")||"<tr><td colspan=5>Nenhum item.</td></tr>"}</table></div>`}function newM(){modal(`<h2>Papelaria / embalagem</h2><div class=form><div class=field><label>Nome</label><input id=mn placeholder="Sacola EIRON"></div><div class=field><label>Tipo</label><select id=mt><option>Embalagem</option><option>Papelaria</option><option>Adicional</option></select></div><div class=field><label>Fornecedor</label><input id=ms></div><div class=field><label>Quantidade comprada</label><input id=mq type=number value=1></div><div class=field><label>Valor total</label><input id=mv type=number step=.01></div><div class=field><label>Estoque</label><input id=mi type=number></div></div><button class=btn onclick=closeM()>Cancelar</button> <button class="btn primary" onclick="saveM()">Salvar</button>`)}function saveM(){let q=+mq.value||1,v=+mv.value||0;db.m.push({n:mn.value,t:mt.value,s:ms.value,q:+mi.value||0,u:v/q});save();closeM();render()}function settings(){return `<div class=card><h2>Configurações</h2><div class=field><label>Margem padrão (%)</label><input id=mar type=number value="${db.margin}"></div><button class="btn primary" onclick="db.margin=+mar.value||0;save();render()">Salvar</button></div>`}function modal(x){box.innerHTML=x;modalEl=document.querySelector(".modal");modalEl.classList.add("on")}function closeM(){document.querySelector(".modal").classList.remove("on")}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="eiron-stock-backup.json";a.click()}nav();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script></body></html>
